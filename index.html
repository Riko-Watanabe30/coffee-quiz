<script>window.__QA__={"cats": ["理念・ブランド・歴史", "接客・店舗運営", "コーヒーの起源・産地・品種", "精製・格付け・認証", "焙煎", "生産国", "スペシャルティ・タリーズの取り組み", "抽出の基本", "豆の鮮度・保存・管理ルール", "抽出器具", "抽出のカスタマイズ", "アイスコーヒー・水出し", "テイスティング・ペアリング", "ビーンズ商品知識", "ビーンズ販売・試飲"], "qs": [{"c": 0, "q": "タリーズコーヒージャパンの経営理念で、一杯のコーヒーを通じて新しい価値を創造し共に成長する対象として挙げられている3つは？", "a": "「お客様」「フェロー」「社会」", "n": "一杯のコーヒーを通じて、お客様・フェロー・社会に新しい価値を創造し、共に成長する。"}, {"c": 0, "q": "経営理念の5つの項目のうち、1つ目は？", "a": "その一杯に心を込める", "n": ""}, {"c": 0, "q": "経営理念の5つの項目のうち、2つ目は？", "a": "お客様の期待を超越する", "n": ""}, {"c": 0, "q": "経営理念で、タリーズが目指す「地域社会に根ざした」何になると掲げている？", "a": "コミュニティーカフェ", "n": ""}, {"c": 0, "q": "経営理念で、職場について掲げている内容は？", "a": "最高の仕事が経験できて、一人一人の可能性が広がる職場をつくる", "n": ""}, {"c": 0, "q": "経営理念で、子ども達や青少年について掲げている内容は？", "a": "子ども達や青少年の成長を促すために、夢や目標のお手伝いをする", "n": ""}, {"c": 0, "q": "タリーズでは経営理念を何として大切にしている？", "a": "行動指針", "n": "自分は何ができるのか、何が必要かを常に考え行動する。"}, {"c": 0, "q": "運営ポリシー「5つの最高」をすべて答えよ。", "a": "最高の豆・最高の焙煎・最高のバリスタ・最高のホスピタリティ・そして最高の…！", "n": ""}, {"c": 0, "q": "「5つの最高」の「最高の豆」では、バイヤーが原産地へ行き何種を厳選して使用している？", "a": "アラビカ種", "n": ""}, {"c": 0, "q": "「5つの最高」の「最高の焙煎」で、より鮮度の高い豆を届けられる理由は？", "a": "国内焙煎だから", "n": ""}, {"c": 0, "q": "「5つの最高」の「最高のバリスタ」で習得すべきとされている3つは？", "a": "技術・知識・接客スキル", "n": ""}, {"c": 0, "q": "「5つの最高」の「最高のホスピタリティ」とは？", "a": "おもてなしの心・思いやりを持ってお客様と接し、その気持ちを行動に移すこと", "n": ""}, {"c": 0, "q": "「5つの最高」の5つ目「そして最高の・・・！」の内容は？", "a": "フェロー一人一人が毎日目標を立て、最高の何かをお客様に提供する", "n": ""}, {"c": 0, "q": "QHCの「Q」は何を表す？", "a": "Quality（クオリティ）＝商品の品質の良さ", "n": ""}, {"c": 0, "q": "QHCの「H」は何を表す？", "a": "Hospitality（ホスピタリティ）＝おもいやり、おもてなしの心", "n": ""}, {"c": 0, "q": "QHCの「C」は何を表す？", "a": "Cleanliness（クレンリネス）＝清潔さ、衛生的な空間の維持", "n": ""}, {"c": 0, "q": "QHCはどれか一つできていればよい？", "a": "いいえ。全てが高い次元で実現できてこそお客様の満足が向上する", "n": "QHCはお客様満足向上のための店舗運営の指標の一つ。"}, {"c": 0, "q": "タリーズの挨拶の気持ちを表すスローガンは？", "a": "HELLO FELLOW", "n": ""}, {"c": 0, "q": "「HELLO FELLOW」で相手に伝える3つの気持ちは？", "a": "①人を好きになり感謝する気持ち ②人を尊敬する気持ち ③タリーズを好きな気持ち", "n": "前提は「人に関心を持って」。"}, {"c": 0, "q": "タリーズコーヒーが米国シアトルで創業したのは何年？", "a": "1992年", "n": ""}, {"c": 0, "q": "タリーズコーヒーの創業者は？", "a": "トム・タリー・オキーフ（Tom Tully O'Keefe）", "n": "不動産会社を営んでいた。"}, {"c": 0, "q": "タリーズ創業当時のシアトル発祥のコーヒームーブメントを何と呼ぶ？", "a": "セカンドウェーブ", "n": ""}, {"c": 0, "q": "日本での第1号店はどこ？何年何月にオープン？", "a": "銀座店（1997年8月）", "n": ""}, {"c": 0, "q": "タリーズコーヒージャパン株式会社が設立されたのは？", "a": "1998年5月", "n": ""}, {"c": 0, "q": "タリーズがフランチャイズ事業を開始したのは何年？", "a": "2000年", "n": ""}, {"c": 0, "q": "2001年10月、米国Tully's Coffee Corporationから取得した権利は？", "a": "日本国におけるコーヒー豆の焙煎と卸売の権利", "n": ""}, {"c": 0, "q": "病院内1号店「好仁会東大病院店」がオープンしたのは？", "a": "2004年4月", "n": ""}, {"c": 0, "q": "日本における「Tully's Coffee」商標権を完全取得したのは？", "a": "2005年8月", "n": ""}, {"c": 0, "q": "タリーズが株式会社伊藤園グループとなったのは？", "a": "2006年11月", "n": ""}, {"c": 0, "q": "タリーズが全国47都道府県に出店を果たしたのは何年？（555号店は鳥取大学医学部附属病院店）", "a": "2014年（4月）", "n": ""}, {"c": 0, "q": "タリーズ（日本）が創業20周年を迎えたのは？", "a": "2017年8月", "n": ""}, {"c": 0, "q": "100号店はどこ？", "a": "小田原ダイナシティ店（2002年12月）", "n": ""}, {"c": 0, "q": "500号店はどこ？", "a": "歌舞伎座店（2013年3月）", "n": ""}, {"c": 0, "q": "800号店はどこ？", "a": "KITTE大阪店（2024年7月）", "n": ""}, {"c": 0, "q": "タリーズの商品カテゴリーで、エスプレッソを使ったドリンクを何と呼ぶ？", "a": "エスプレッソビバレッジ", "n": "ほかに本日のコーヒー、ティービバレッジ、スワークル®バレッジ、ホットミール、パスタ・デリカ、スイーツ、ビーンズ。"}, {"c": 1, "q": "元気の良い明るいあいさつの店舗では、お客様はどんな気持ちになる？", "a": "ポジティブな気持ち", "n": "あいさつのない元気のない店舗ではネガティブな気持ちになり、再来店は難しくなる。"}, {"c": 1, "q": "「3つのあいさつ」を答えよ。", "a": "①お迎えのあいさつ ②レジでのあいさつ ③お見送りのあいさつ", "n": ""}, {"c": 1, "q": "お迎えのあいさつは誰が、いつ行う？", "a": "みんなで、お客様がお店に入ったらすぐに元気よく", "n": ""}, {"c": 1, "q": "レジでのあいさつは誰が、どのように行う？", "a": "キャッシャーが、お客様が目の前にいらしたら明るく丁寧に", "n": ""}, {"c": 1, "q": "お見送りのあいさつは誰が、どのように行う？", "a": "バリスタが、お客様の背中に向かって元気よく", "n": ""}, {"c": 1, "q": "「店内でお召し上がりでよろしかったですか？」の正しい言い方は？", "a": "店内でお召し上がりでよろしいですか？", "n": "過去形にするのは間違い。"}, {"c": 1, "q": "「1万円から、お預かりいたします」の正しい言い方は？", "a": "1万円、お預かりいたします", "n": "「から」は不要。"}, {"c": 1, "q": "「ドリンクのほうは、提供台でお出しいたします」の何が間違い？", "a": "「ほう」は方角や二者のどちらかを示す言葉なので不要。「ドリンクは、提供台で…」", "n": ""}, {"c": 1, "q": "「カフェラテになります」の正しい言い方は？", "a": "カフェラテです（ございます）", "n": "「なります」は状態が変わることを言う。"}, {"c": 1, "q": "320円をちょうどいただいた時の正しい言い方は？", "a": "320円、ちょうど頂戴いたします", "n": "「お預かり」はお釣りがある時に使う。"}, {"c": 1, "q": "「お豆はお挽きしますか？」の正しい言い方は？", "a": "豆（ビーンズ）はお挽きしますか？", "n": "「お」の過剰使用。商品には使用しない。"}, {"c": 1, "q": "カスタマーリカバリーとは？", "a": "お客様が不満や怒りを感じたときに、失った信用を取り戻すための対応", "n": ""}, {"c": 1, "q": "カスタマーリカバリーの基本姿勢4つを順に答えよ。", "a": "①お詫びする ②共感する ③提案する ④感謝する", "n": ""}, {"c": 1, "q": "カスタマーリカバリーの「お詫び」はどのような態度で行う？", "a": "真摯な態度で", "n": ""}, {"c": 1, "q": "カスタマーリカバリーの「共感」はどう行う？", "a": "お客様の立場になって共感する", "n": ""}, {"c": 1, "q": "カスタマーリカバリーの「感謝」は何に対して行う？", "a": "教えていただいた（ご指摘いただいた）ことに対して", "n": ""}, {"c": 1, "q": "カスタマーリカバリーで「提案」できることが無い時はどうする？", "a": "社員に判断を仰ぐ。社員不在でお待たせしそうな場合は、自分では判断できないことを伝え、責任者より連絡する旨を伝える（お名前・連絡先を伺う）", "n": ""}, {"c": 1, "q": "ポジションの略号「F」「C」「CF」「B」「BF」「K」はそれぞれ何？", "a": "F＝フロア、C＝キャッシャー、CF＝キャッシャーフォロー、B＝バリスタ、BF＝バリスタフォロー、K＝キッチン", "n": ""}, {"c": 1, "q": "フロア（客席）を清潔に保ち、室温・BGMの管理やお客様のご案内をするポジションは？", "a": "フロア（F）", "n": ""}, {"c": 1, "q": "お客様のオーダーを伺い、POSレジ操作や代金の受け取り、レジ提供品の提供をするポジションは？", "a": "キャッシャー（C）", "n": ""}, {"c": 1, "q": "レジ提供商品の準備、COD抽出の管理、商品・資材の補充、2台目レジ対応を行うポジションは？", "a": "キャッシャーフォロー（CF）", "n": ""}, {"c": 1, "q": "ドリンクの作成・提供、お待ちのお客様へのアナウンスを行うポジションは？", "a": "バリスタ（B）", "n": ""}, {"c": 1, "q": "フードの焼成やブレンダー（スワークル等）の作成、バリスタのサポートを行うポジションは？", "a": "バリスタフォロー（BF）", "n": ""}, {"c": 1, "q": "パスタ・リゾットの作成、冷蔵庫・冷凍庫の管理、食器類の洗浄を行うポジションは？", "a": "キッチン（K）", "n": ""}, {"c": 1, "q": "キャッシャーがレジで提供する商品の例を挙げよ。", "a": "COD（本日のコーヒー）、アイスコーヒー、サンドイッチなど", "n": ""}, {"c": 1, "q": "ドレスコードの3つのポイントは？", "a": "①清潔感があり、お客様に不快感を与えない ②衛生的で、安心・安全が確保できる ③異物混入などが発生しない", "n": "満たさない場合はシフトインできない。"}, {"c": 1, "q": "前髪・横髪が目や頬にかかってはいけない理由は？", "a": "顔を手で触る原因となり不衛生だから（顔には菌が多い）", "n": ""}, {"c": 1, "q": "髪が肩にかかる長さの場合はどうする？", "a": "アップにしてひとまとめにする（髪留めは外れにくく、シンプルで小さいもの）", "n": ""}, {"c": 1, "q": "社員フェローの適切な髪色の明るさは？", "a": "ブラウン系で（カラースケール）「5」程度の明るさまで", "n": "アルバイトフェローはブラウン系であれば明るさは問わない（2024年11月〜）。赤・ピンク・緑・青など、ブラウン系以外は禁止。"}, {"c": 1, "q": "トップスの長袖はどこまでまくる？", "a": "肘あたりまで", "n": ""}, {"c": 1, "q": "ボトムスのズボン・スカートの丈の決まりは？", "a": "ズボンは長ズボン、スカートは膝丈", "n": ""}, {"c": 1, "q": "ボトムスで禁止されている素材・種類の例は？", "a": "皮革素材、ジャージ・スウェット素材、スパッツ等の伸縮素材、スポーツウェア、ジョガーパンツ", "n": ""}, {"c": 1, "q": "スカート着用時の足元は？", "a": "落ち着いた色のタイツ・ストッキングを着用", "n": ""}, {"c": 1, "q": "靴の条件は？", "a": "安全で滑りにくいもの（色指定なし）", "n": ""}, {"c": 1, "q": "エプロンのロゴマークの高さと、腰の紐の結び方の推奨は？", "a": "ロゴは胸の高さ、紐は前結び推奨", "n": ""}, {"c": 1, "q": "エプロンはどのくらいの頻度で洗濯する？", "a": "週に一度は洗濯し、アイロンをかける", "n": "エプロンは店舗備品。退職時は店舗へ返却。"}, {"c": 1, "q": "コーヒーアドバイザーバッジは現在使用できる？", "a": "使用できない（廃止された）", "n": ""}, {"c": 1, "q": "新ネームプレートはどこにつける？", "a": "クリップで左上に挟む", "n": ""}, {"c": 1, "q": "ペン類の持ち込みの決まりは？", "a": "1本まで（シャープペンシルは禁止）", "n": ""}, {"c": 1, "q": "爪の長さの基準は？", "a": "1mm以内（付け爪・マニキュア不可）", "n": ""}, {"c": 1, "q": "アクセサリー類が全て不可とされる理由は？", "a": "異物混入の可能性があるため", "n": ""}, {"c": 1, "q": "ドレスコードで「不可」とされるものを挙げよ（髪・爪・アクセサリー以外）。", "a": "匂いの強い化粧品・整髪料・柔軟剤、髭、つけまつ毛、スマホ・携帯電話の持ち込み", "n": "見えるタトゥーは隠す。マスクは落ち着いた色（柄物不可）。"}, {"c": 1, "q": "マタニティ・ドレスコードで着用が認められているものは？", "a": "ジャンパースカート、ストレッチ素材の衣服", "n": ""}, {"c": 1, "q": "ドレスコード改定で、デニム生地は着用できるようになった？", "a": "着用可（以前は不可）", "n": ""}, {"c": 1, "q": "バリスタコンテストの主な審査内容は？", "a": "バリスタオペレーションと接客応対", "n": ""}, {"c": 1, "q": "バリスタコンテストの対象者は？", "a": "全国の店舗フェロー（アルバイト、社員）", "n": ""}, {"c": 1, "q": "バリスタコンテストの目的は？", "a": "タリーズブランドにおけるバリスタの重要性の確認と発信、経営理念の体現", "n": ""}, {"c": 1, "q": "バリスタコンテストで体現する経営理念を3つ挙げよ。", "a": "『その一杯に心を込める』『お客様の期待を超越する』『一人一人の可能性が広がる職場を作る』", "n": ""}, {"c": 1, "q": "バリスタコンテストの大会の流れを順に答えよ。", "a": "店舗予選 → ディストリクト予選 → 地区大会 → 全国大会", "n": ""}, {"c": 1, "q": "店舗予選では各店舗から誰を選出する？", "a": "アルバイトフェローの代表を1名", "n": ""}, {"c": 1, "q": "QHC向上の最大のポイントとされているのは何？", "a": "バリスタの育成", "n": ""}, {"c": 2, "q": "コーヒーが最初に発見されたとされるのはいつ頃、どこ？", "a": "西暦600年頃、エチオピア", "n": ""}, {"c": 2, "q": "コーヒー発見の伝説「カルディと踊るヤギたち」のカルディとは誰？", "a": "ヤギを連れて旅をしていた修道僧", "n": ""}, {"c": 2, "q": "コーヒーは最初、どのような形で飲まれていた？", "a": "チェリーを煮詰めてスープのような形で（薬のような物として扱われていた）", "n": ""}, {"c": 2, "q": "一次産品の取引額でコーヒーは何位と言われる？", "a": "石油に次いで第2位", "n": "水の次に世界で最も飲まれている飲み物とも言われる。"}, {"c": 2, "q": "コーヒーベルトとはどの地域のこと？", "a": "赤道を中心に北回帰線と南回帰線に挟まれた地域", "n": ""}, {"c": 2, "q": "コーヒーベルトの気候条件（平均気温・年間降雨量）は？", "a": "平均気温20℃以上、年間降雨量1500〜2000mm", "n": ""}, {"c": 2, "q": "コーヒーベルトには約何カ国の生産国がある？", "a": "約60カ国", "n": ""}, {"c": 2, "q": "回帰線は「北緯・南緯何度」と表記されることが多い？", "a": "25度（正確には23度26分22秒）", "n": ""}, {"c": 2, "q": "日本でコーヒー農園がわずかにある場所は？", "a": "沖縄や小笠原諸島", "n": ""}, {"c": 2, "q": "コーヒーが「暑い国の高地」で栽培される理由は？", "a": "寒さに弱く（霜で枯れる）、暑すぎるのにも弱いため。高地は「常春」の気候になる", "n": ""}, {"c": 2, "q": "コーヒー栽培に適した標高と赤道の関係は？", "a": "赤道に近いほど高く、離れるほど低くなる", "n": ""}, {"c": 2, "q": "標高が高いと美味しいコーヒーになりやすい理由は？", "a": "昼夜の寒暖差が大きく実がゆっくり熟し、熟度が高く甘い果実になりやすい（良質な酸味）", "n": "さらに気温・湿度が低めで虫や病気が発生しにくい。"}, {"c": 2, "q": "コーヒー栽培にちょうど良い平均気温は？", "a": "20℃前半くらい", "n": ""}, {"c": 2, "q": "コーヒーの樹は何科の植物？", "a": "アカネ科（コーヒーノキ属）", "n": ""}, {"c": 2, "q": "コーヒー豆は植物のどの部分？", "a": "コーヒーチェリーと呼ばれる果実の中の種子", "n": ""}, {"c": 2, "q": "コーヒーの3大品種は？", "a": "アラビカ種・ロブスタ種・リベリカ種", "n": ""}, {"c": 2, "q": "アラビカ種の原産地は？", "a": "エチオピア", "n": ""}, {"c": 2, "q": "アラビカ種は世界の生産量の何％程度を占める？", "a": "55%程度", "n": ""}, {"c": 2, "q": "アラビカ種の弱点は？", "a": "とてもデリケートで、病気・霜・乾燥・強すぎる日差し等に弱い", "n": ""}, {"c": 2, "q": "スペシャルティコーヒーはどの品種から選ばれる？", "a": "100%アラビカ種", "n": ""}, {"c": 2, "q": "アラビカ種の中で特に古くからある2品種は？", "a": "ティピカ種とブルボン種", "n": "ほかにカトゥーラ種など。"}, {"c": 2, "q": "アラビカとロブスタの両方の特性を持つ品種を何と呼ぶ？", "a": "ハイブリッド種", "n": ""}, {"c": 2, "q": "ロブスタ種の原産地は？", "a": "コンゴ", "n": ""}, {"c": 2, "q": "ロブスタ種は世界の生産量の何％程度を占める？", "a": "45%程度", "n": ""}, {"c": 2, "q": "ロブスタ種の香りと味の特徴は？", "a": "焦げた麦のような独特の香りと強い苦味", "n": ""}, {"c": 2, "q": "ロブスタ種の主な用途は？", "a": "インスタント・缶コーヒー・業務用ブレンドなどコーヒー飲料の原材料", "n": ""}, {"c": 2, "q": "ロブスタ種の正式な品種名は？", "a": "カネフォラ種ロブスタ（カネフォラ種とも呼ぶ）", "n": ""}, {"c": 2, "q": "ロブスタ種のメジャーな産地は？", "a": "ベトナム、ブラジル、インドネシアなど", "n": ""}, {"c": 2, "q": "ロブスタ種とアラビカ種のカフェイン含有量（豆重量比）は？", "a": "ロブスタ2〜3%、アラビカ1〜2%", "n": ""}, {"c": 2, "q": "ロブスタ種の長所は？", "a": "病気や環境への耐性に優れ丈夫で、標高が高くなくても栽培しやすく、収穫量が多い", "n": ""}, {"c": 2, "q": "リベリカ種の原産地は？", "a": "リベリア", "n": ""}, {"c": 2, "q": "リベリカ種の弱点は？", "a": "病気（特にサビ病）に弱い", "n": ""}, {"c": 2, "q": "リベリカ種が市場に出回らない理由は？", "a": "味はアラビカに劣り、耐性はロブスタに劣るため際立ったメリットがなく、西アフリカの一部で国内消費される程度", "n": ""}, {"c": 2, "q": "コーヒーの種をまいてから発芽までの期間は？", "a": "30日程度", "n": "苗木は半年ほどかけて日陰で育てる。"}, {"c": 2, "q": "苗木を農園に植えてから、しっかり収穫できる樹になるまでの期間は？", "a": "2〜3年くらい", "n": ""}, {"c": 2, "q": "コーヒーの花が咲くのはどの時期？花の色と香りは？", "a": "雨季（まとまった雨の後）。白い花でジャスミンのような甘い香り", "n": ""}, {"c": 2, "q": "花が散った後、チェリーが育つまでにどのくらいかかる？", "a": "半年以上", "n": ""}, {"c": 2, "q": "乾季はコーヒーにとってどんな期間？", "a": "チェリーが赤く熟していく期間、そして収穫・精製の期間", "n": ""}, {"c": 2, "q": "美味しいコーヒーになるための収穫のポイントは？", "a": "いかに完熟チェリーのみが集められているか", "n": ""}, {"c": 2, "q": "コーヒーチェリーの中には種子がいくつ入っている？", "a": "2粒（向かい合って入っている）", "n": ""}, {"c": 2, "q": "種子を包むパーチメントやシルバースキンを取り除いて乾燥させたものを何と呼ぶ？", "a": "生豆（なままめ）", "n": ""}, {"c": 2, "q": "パーチメントとは？", "a": "種子を覆う殻のようなもの（パーチメントがついたままの豆も指す）", "n": ""}, {"c": 3, "q": "チェリーから種子を取り出して「コーヒー豆」の状態にすることを何と呼ぶ？", "a": "精製", "n": ""}, {"c": 3, "q": "精製の3つの基本パターンは？", "a": "ナチュラル（乾燥式）・ウォッシュド（水洗式）・パルプドナチュラル（半水洗式）", "n": ""}, {"c": 3, "q": "ナチュラル（乾燥式）の方法は？", "a": "チェリーのまま乾燥させた後、脱穀して生豆を取り出す", "n": ""}, {"c": 3, "q": "ナチュラルの味わいの特徴は？", "a": "甘味やコクが強く感じられる印象になりやすい", "n": ""}, {"c": 3, "q": "ナチュラルのデメリットは？", "a": "未熟豆や不純物が混ざりやすく、乾燥具合の見極めを失敗すると品質に影響する。天候にも左右される", "n": ""}, {"c": 3, "q": "ナチュラルの生豆の色は？", "a": "きれいな緑色ではなく、うすめの緑色になることが多い", "n": ""}, {"c": 3, "q": "ナチュラルが伝統的に使われてきた国の例は？", "a": "エチオピア、イエメン、ブラジルなど（水が豊富でない土地）", "n": ""}, {"c": 3, "q": "コンクリートなどでできた乾燥場を何と呼ぶ？", "a": "パティオ", "n": ""}, {"c": 3, "q": "ナチュラルで乾燥が仕上がるまでの期間は？", "a": "2週間程度", "n": "乾燥したチェリーは黒くカラカラになる。"}, {"c": 3, "q": "網棚で乾燥させる方法を何と呼ぶ？", "a": "アフリカンベッド", "n": ""}, {"c": 3, "q": "アフリカンベッドで乾燥させるメリットは？", "a": "風通しが良く均一に乾燥しやすい。ゆっくり乾燥し甘味やコクが楽しめる仕上がりに。手作業で未熟豆や不純物を除ける", "n": ""}, {"c": 3, "q": "ウォッシュド（水洗式）の方法は？", "a": "収穫直後のチェリーから種子を取り出し、果肉も取り除いてからパーチメントの状態で乾燥させ、最後に脱穀する", "n": ""}, {"c": 3, "q": "ウォッシュドの味わいの特徴は？", "a": "雑味が少なくクリアですっきりとした印象", "n": ""}, {"c": 3, "q": "ウォッシュドの生豆の色は？", "a": "きれいな緑色", "n": ""}, {"c": 3, "q": "チェリーの皮を取り除く機械を何と呼ぶ？", "a": "パルパー", "n": ""}, {"c": 3, "q": "ウォッシュドの発酵工程の時間は？", "a": "24〜48時間程度", "n": ""}, {"c": 3, "q": "パーチメントを覆うぬるっとした果肉分を何と呼ぶ？", "a": "ぬめり、またはミューシレージ", "n": ""}, {"c": 3, "q": "発酵の工程があるウォッシュドを特に何と呼ぶ？", "a": "フーリーウォッシュド", "n": ""}, {"c": 3, "q": "焙煎豆のセンターカットにシルバースキンが多く残っているのはナチュラル・ウォッシュドどちら？", "a": "ウォッシュド", "n": "ナチュラルは焙煎中に燃えてはがれやすい。"}, {"c": 3, "q": "パルプドナチュラル（半水洗式）の方法は？", "a": "ウォッシュドと同様にパーチメントを取り出した後、果肉が残った状態で乾燥させる", "n": ""}, {"c": 3, "q": "パルプドナチュラルの味わいの特徴は？", "a": "甘味やコクの豊かなコーヒー（ウォッシュドに甘み・コクがプラスされるイメージ）", "n": ""}, {"c": 3, "q": "コスタリカではパルプドナチュラルを何と呼ぶ？", "a": "ハニープロセス", "n": ""}, {"c": 3, "q": "格付け（グレーディング）の主な基準3つは？", "a": "豆の大きさ・標高・欠点数（世界統一の基準はない）", "n": ""}, {"c": 3, "q": "タリーズはコーヒー豆の採用を何によって決めている？", "a": "グレードやブランドにとらわれず、テイスティング（味わい）の評価", "n": ""}, {"c": 3, "q": "コロンビアの最高等級は？", "a": "スプレモ（スクリーン17以上の粒が80%以上）", "n": "エキセルソはスクリーン14〜16。"}, {"c": 3, "q": "スクリーンの数値が大きいほど豆はどうなる？", "a": "粒が大きい（スクリーン1＝1/64インチ）", "n": ""}, {"c": 3, "q": "タンザニアの最高等級「AA」の読み方と基準は？", "a": "ダブルエー、スクリーン6.75mm以上", "n": ""}, {"c": 3, "q": "グァテマラの格付けは何を基準にしている？", "a": "生産地の標高", "n": ""}, {"c": 3, "q": "グァテマラの最高等級「SHB」の正式名と標高基準は？", "a": "ストリクトハードビーン、標高1350m以上", "n": ""}, {"c": 3, "q": "ブラジルの格付けの基準は？", "a": "欠点数＋粒の大きさ（300g中の欠点数でNo.2〜8に分類）", "n": ""}, {"c": 3, "q": "ブラジルの最高ランクは？", "a": "No.2（300g中の欠点数4点以下）", "n": "欠点ゼロはありえないという考えから「No.1」は使わない。"}, {"c": 3, "q": "エチオピアの最高等級G1の基準は？", "a": "欠点豆が300g中0〜3個", "n": ""}, {"c": 3, "q": "精製途中で発酵（腐敗）した欠点豆は？", "a": "発酵豆", "n": ""}, {"c": 3, "q": "チェリーが地面に落下して腐った欠点豆は？", "a": "黒豆", "n": ""}, {"c": 3, "q": "脱穀されていない乾燥したチェリーの状態の欠点を何と呼ぶ？", "a": "コッコ", "n": ""}, {"c": 3, "q": "1960年代にヨーロッパで始まった、途上国の生産者と適正価格で継続的に取引する認証は？", "a": "フェアトレード", "n": ""}, {"c": 3, "q": "熱帯雨林の維持を目的に設立された非営利団体による認証は？", "a": "レインフォレストアライアンス", "n": ""}, {"c": 3, "q": "強い日差しに弱いアラビカの樹木を守り、森林保全にも貢献する栽培方法は？", "a": "日陰栽培（シェードグロウン）", "n": ""}, {"c": 4, "q": "焙煎とは？", "a": "生豆を加熱して組織を膨張させ、化学変化にともなう香味成分を引き出す作業（生豆の特徴・おいしさを引き出す工程）", "n": ""}, {"c": 4, "q": "タリーズで基本としているローストレベルは？", "a": "フルシティロースト", "n": ""}, {"c": 4, "q": "ローストレベル8段階を浅煎りから順に答えよ。", "a": "ライト→シナモン→ミディアム→ハイ→シティ→フルシティ→フレンチ→イタリアン", "n": ""}, {"c": 4, "q": "浅煎りの豆のほうが酸味が強い理由は？", "a": "酸味の元になる成分は加熱初期だけ増えるが、すぐに減少していくため", "n": ""}, {"c": 4, "q": "焙煎が進むと増していくものは？", "a": "苦味とボディ", "n": ""}, {"c": 4, "q": "焙煎後の豆は焙煎前より何％ほど軽くなる？", "a": "15〜20%", "n": ""}, {"c": 4, "q": "生豆の油脂分はどのくらい？", "a": "12〜13%ほど", "n": ""}, {"c": 4, "q": "フルシティより深煎りの豆はいつオイルが染み出る？", "a": "焙煎直後から", "n": "シティローストぐらいまでは時間が経つにつれて少しずつ染み出る。オイルがあれば新しいとは限らない。"}, {"c": 4, "q": "焙煎中に豆が瞬間的に膨らむことを何と呼ぶ？", "a": "ハゼ（爆ぜる）", "n": ""}, {"c": 4, "q": "1ハゼと2ハゼの音の違いは？", "a": "1ハゼはパチパチ、2ハゼはピチピチ", "n": ""}, {"c": 4, "q": "1ハゼが起こるのはどのローストレベル？", "a": "シナモン（ライトは1ハゼ手前）", "n": ""}, {"c": 4, "q": "2ハゼが始まり煙が出てくるのはどのローストレベル？", "a": "シティ", "n": "フルシティでは2ハゼ・煙が多く出てオイルが出始める。"}, {"c": 4, "q": "焙煎段階の進みが加速するのはどのあたりから？", "a": "シティローストあたりから", "n": ""}, {"c": 4, "q": "焙煎の段階を精密に把握するための数値は？", "a": "L値（黒が0、白が100。LはLight）", "n": ""}, {"c": 4, "q": "熱源の火が直接豆に触れる焙煎機の方式は？", "a": "直火式（風味と甘味に優れるが焼きムラが起きやすい）", "n": ""}, {"c": 4, "q": "加熱のコントロールがしやすくムラなく安定するが、香りが飛びやすい焙煎機の方式は？", "a": "熱風式", "n": ""}, {"c": 4, "q": "火が直接当たらず焼きムラが起きにくく、短時間焙煎も可能な万能型の焙煎機の方式は？", "a": "半熱風式", "n": ""}, {"c": 4, "q": "生豆の状態でブレンドしてから焙煎する方法は？", "a": "プレミックス（効率的だが、豆ごとの特徴を最大限に引き出しにくい）", "n": ""}, {"c": 4, "q": "豆ごとに焙煎した後でブレンドする方法は？", "a": "アフターミックス（豆ごとの持ち味を引き出せるが、コストと手間がかかる）", "n": ""}, {"c": 5, "q": "コーヒーの3つの生産エリアと味わいの傾向は？", "a": "中南米＝バランスが良い・飲みやすい、アジア・オセアニア＝深いコク、アフリカ＝華やか・フルーティ", "n": ""}, {"c": 5, "q": "世界第1位のコーヒー生産国は？", "a": "ブラジル", "n": ""}, {"c": 5, "q": "ブラジルのコーヒーがブレンドによく使われる理由は？", "a": "安定した供給量があり、他の産地の豆とも合わせやすいから", "n": ""}, {"c": 5, "q": "ブラジルで多い精製方法は？", "a": "ナチュラル", "n": ""}, {"c": 5, "q": "ブラジルのコーヒーの味わいの特徴は？", "a": "控えめな酸味と程よいボディ・香ばしさ、全体的にバランスが良い", "n": ""}, {"c": 5, "q": "豊かな降雨量と肥沃な火山土壌で知られ、地域ごとに多様な味わいがある中米の国は？", "a": "グァテマラ", "n": ""}, {"c": 5, "q": "ほぼ全ての農園で手作業が行われ、水洗式アラビカ種の生産量が世界一の国は？", "a": "コロンビア", "n": ""}, {"c": 5, "q": "コロンビアの味わいの特徴は？", "a": "はっきりとした酸味とクリアで豊かな香り", "n": ""}, {"c": 5, "q": "環境保全や生産者の生活向上に国をあげて取り組み、5ヘクタール未満の小規模農園が多い国は？", "a": "コスタリカ", "n": ""}, {"c": 5, "q": "コスタリカの味わいの特徴は？", "a": "明るく爽やかな酸味とクリアな味わい", "n": ""}, {"c": 5, "q": "「ブルーマウンテン」の産地は？", "a": "ジャマイカ（標高2,256mのブルーマウンテンの特定エリア）", "n": ""}, {"c": 5, "q": "アジアのアラビカで有名な、インドネシアの銘柄は？", "a": "マンデリン（深いボディ）", "n": ""}, {"c": 5, "q": "マンデリンはインドネシアのどこで栽培される？", "a": "スマトラ島北部", "n": ""}, {"c": 5, "q": "インドネシアのスラウェシ島のコーヒーの銘柄は？", "a": "トラジャ", "n": ""}, {"c": 5, "q": "インドネシアのコーヒー生産の約何割がロブスタ？", "a": "約9割", "n": ""}, {"c": 5, "q": "1930年代にブルーマウンテンから樹が移植されて生産が始まった国は？", "a": "パプアニューギニア", "n": ""}, {"c": 5, "q": "パプアニューギニアで今なお多く栽培されている原種は？", "a": "ティピカ種", "n": ""}, {"c": 5, "q": "パプアニューギニアのコーヒーの味わいの特徴は？", "a": "フルーティなさわやかさや甘味", "n": ""}, {"c": 5, "q": "ロブスタの生産量世界1位の国は？", "a": "ベトナム（約95%がロブスタ）", "n": ""}, {"c": 5, "q": "アフリカのコーヒーの味わいの特徴は？", "a": "特徴的な酸味と程よいボディ、フルーティ・フローラル・スパイシーな華やかなアロマ・フレーバー", "n": ""}, {"c": 5, "q": "エチオピアとイエメンのコーヒーに「モカ」と付く由来は？", "a": "イエメンのモカ港から輸出されていたため", "n": ""}, {"c": 5, "q": "現在、日本で流通している「モカ」の多くはどこ産？", "a": "エチオピア産", "n": ""}, {"c": 5, "q": "エチオピアの有名な栽培地方を挙げよ。", "a": "シダモ、イルガチェフェ、ハラー、ジンマなど", "n": ""}, {"c": 5, "q": "エチオピアのモカに特徴的な香りを何と呼ぶ？", "a": "モカフレーバー（フルーツやお花を思わせる独特の甘い香り）", "n": ""}, {"c": 5, "q": "エチオピアの、家族や近所の人が集まって外でコーヒーを楽しむ伝統慣習は？", "a": "コーヒーセレモニー（各家庭のお嫁さんが焙煎から抽出まで行う）", "n": ""}, {"c": 5, "q": "「キリマンジャロ」の産地の国は？", "a": "タンザニア（キリマンジャロ山5,895mの裾野の高原地帯）", "n": ""}, {"c": 5, "q": "タンザニアのコーヒーの特徴は？", "a": "特徴的な酸味と、フルーティ感や甘味", "n": ""}, {"c": 5, "q": "安定して良質なコーヒーを生産する産地として世界的に有名なアフリカの国は？", "a": "ケニア（個性的な酸味からくるフルーティ感と甘く華やかなアロマ）", "n": ""}, {"c": 5, "q": "世界のコーヒー消費量の国別順位（1〜4位）は？", "a": "1位アメリカ、2位ブラジル、3位ドイツ、4位日本", "n": ""}, {"c": 5, "q": "コーヒー輸入量の国別順位（1〜3位）は？", "a": "1位アメリカ、2位ドイツ、3位日本", "n": ""}, {"c": 5, "q": "1人当たりのコーヒー消費量がとても多い地域は？", "a": "北欧（ノルウェーなど）", "n": ""}, {"c": 5, "q": "日本人1人当たりの年間コーヒー消費量は？", "a": "約3.5kg（10g＝1杯換算で約350杯、1日約1杯）", "n": ""}, {"c": 5, "q": "日本のコーヒー生豆の国別輸入量で最も多い国は？", "a": "ブラジル（次いでベトナム、コロンビア）", "n": ""}, {"c": 6, "q": "スペシャルティコーヒーとは？", "a": "品質向上・品質管理が徹底された農園の豆を使い、香りや味わいが際立って印象的で個性がはっきり感じられる“おいしい”コーヒー", "n": ""}, {"c": 6, "q": "スペシャルティコーヒーで重要なのはグレードや農園ブランドか？", "a": "いいえ。あくまで味わいの評価が重要", "n": ""}, {"c": 6, "q": "スペシャルティに対して一般品を何と呼ぶことがある？", "a": "コモディティ", "n": ""}, {"c": 6, "q": "スペシャルティコーヒーという言葉はどこで、どんな考えから生まれた？", "a": "ひと昔前のアメリカで、「質より量」の大量生産・消費に対し、品質や個性を大切にして価値を上げようという考えから", "n": ""}, {"c": 6, "q": "スペシャルティコーヒーの完成までを表す「種子からカップまで」の英語表現は？", "a": "From Seed to Cup", "n": ""}, {"c": 6, "q": "タリーズのコーヒー豆の味わいを直接評価して決めているのは誰？", "a": "タリーズのテイスター（評価者）", "n": ""}, {"c": 6, "q": "タリーズがパートナーシップを結ぶブラジルの農園は？", "a": "ファゼンダバウ（バウ農園）", "n": ""}, {"c": 6, "q": "ポルトガル語で「ファゼンダ」「バウ」の意味は？", "a": "ファゼンダ＝農園、バウ＝宝箱", "n": ""}, {"c": 6, "q": "ファゼンダバウの農園主（創業者）は？", "a": "フクダトミオ氏（現在は2代目フクダタケオ氏が運営）", "n": ""}, {"c": 6, "q": "ファゼンダバウのエリアと標高は？", "a": "セラード・パットスデミナス、1100m前後", "n": ""}, {"c": 6, "q": "2007年1月、ファゼンダバウのタリーズ専用区画に植えた品種は？", "a": "ブルボン種（約65ヘクタール）", "n": ""}, {"c": 6, "q": "ファゼンダバウ初の商品「ブラジルファゼンダバウ ファーストクロップ」の発売は？", "a": "2009年4月", "n": ""}, {"c": 6, "q": "ファゼンダバウでアフリカンベッドを使って生産したナチュラルの商品名は？", "a": "ドライオンベッド", "n": ""}, {"c": 6, "q": "タリーズがグァテマラで2008年から毎年開催しているものは？", "a": "カッピングコンテスト", "n": ""}, {"c": 6, "q": "グァテマラカッピングコンテストで「金賞」を受賞した農協の豆はどうなる？", "a": "農協ごとにパッケージ・商品化される", "n": ""}, {"c": 6, "q": "グァテマラカッピングコンテストの主な目的3つは？", "a": "小規模農協の優れた豆の発掘、品質の良い栽培へのモチベーション向上、生産者の生活向上への貢献", "n": ""}, {"c": 6, "q": "カッピングとは？", "a": "粗挽きの粉をカップに入れ直接お湯を注いで抽出し、スプーンですくってテイスティングする手法", "n": ""}, {"c": 6, "q": "農協単位ではなく区画や農園単位で細かく管理・生産された豆を何と呼ぶ？", "a": "マイクロロット", "n": ""}, {"c": 6, "q": "タリーズがコスタリカマイクロロットプロジェクトで協力しているのは？", "a": "タラス地区のドータ農協", "n": ""}, {"c": 6, "q": "高品質コーヒーの確保が難しくなっている要因は？", "a": "新興国・生産国等の需要拡大と、温暖化による産地の環境変化（買付競争の激化・世界的な品質低下）", "n": ""}, {"c": 6, "q": "ハワイコナの事例をもとにした「接ぎ木の水平展開」で組み合わせる品種は？", "a": "ティピカ種（上部）＋リベリカ種（根）", "n": ""}, {"c": 6, "q": "接ぎ木の水平展開を実施している産地は？", "a": "ペルー、パプアニューギニア、ラオス", "n": ""}, {"c": 6, "q": "マンデリンの開発テストを行っている国は？", "a": "ラオス", "n": ""}, {"c": 6, "q": "乾燥の途中で脱穀し、生豆の状態で仕上げ乾燥を行う、スマトラ島独自の方法は？", "a": "スマトラ式", "n": ""}, {"c": 6, "q": "ブレンド用コスタリカで指定している収穫のタイミングは？", "a": "赤を通り越して紫色に熟したグレープチェリーで収穫", "n": "乾燥は天日乾燥を指定。"}, {"c": 6, "q": "デカフェ処理で生じる2つの課題は？", "a": "①コーヒー本来の特徴が失われる ②処理後の生豆が劣化しやすい", "n": ""}, {"c": 6, "q": "コーヒー豆からカフェインを取り除く液体の3種類は？", "a": "水・超臨界炭素ガス・有機溶媒（日本では禁止）", "n": ""}, {"c": 6, "q": "タリーズが採用しているデカフェ製法は？", "a": "マウンテンウォーターデカフェ（メキシコの工場で水を使う方法）", "n": ""}, {"c": 6, "q": "マウンテンウォーター製法はどんな原理を利用している？", "a": "浸透圧（ものは濃いほうから薄いほうへ流れる）", "n": ""}, {"c": 7, "q": "最高のドリップコーヒーを淹れるための7ステップを答えよ。", "a": "①フレッシュな豆 ②清潔な道具 ③浄水 ④正しい温度 ⑤正しい分量 ⑥正しいグラインディング ⑦適切な抽出時間", "n": ""}, {"c": 7, "q": "コーヒーの劣化が一気に加速するのはいつから？", "a": "豆を挽いた瞬間から", "n": ""}, {"c": 7, "q": "道具が汚れているとどうなる？", "a": "古い油や出涸らしが蓄積し、悪くなった味が一緒に抽出される", "n": ""}, {"c": 7, "q": "タリーズでのコーヒー抽出の基本温度は？", "a": "90℃", "n": ""}, {"c": 7, "q": "出来上がりのコーヒーの何％以上が水分？", "a": "99%以上", "n": ""}, {"c": 7, "q": "コーヒー抽出に基本的に適しているのは軟水・硬水どちら？", "a": "軟水", "n": ""}, {"c": 7, "q": "日本での軟水の定義は？", "a": "水1Lあたりのカルシウム・マグネシウムなどのミネラル含有量が100mg以下", "n": ""}, {"c": 7, "q": "硬水でコーヒーを淹れるとどうなる？", "a": "重たく感じられやすい（場合により苦味もアップ）", "n": ""}, {"c": 7, "q": "抽出温度が高すぎるとどうなる？", "a": "成分が出過ぎて濃いめ、苦味や雑味が多くなる", "n": ""}, {"c": 7, "q": "抽出温度が低すぎるとどうなる？", "a": "苦味・雑味が控えめで、あっさり、酸味をやや多く感じる", "n": ""}, {"c": 7, "q": "メッシュが細かいほど成分が多く溶け出す理由2つは？", "a": "①表面積が大きくなる ②お湯の浸透に時間がかかり長く触れる", "n": ""}, {"c": 7, "q": "挽き方は基本的に何に合わせる？", "a": "器具", "n": "ペーパーフィルターの場合は好みで多少変えてもよい。"}, {"c": 7, "q": "フレンチプレスに細かい粉を使うとどうなる？", "a": "粉っぽくなりすぎたり雑味が出る", "n": ""}, {"c": 7, "q": "エスプレッソマシンにドリップ用の粉を使うとどうなる？", "a": "薄くなる", "n": ""}, {"c": 7, "q": "「濃いめがいいけど苦いのは嫌」というお客様への提案は？", "a": "基本より粗めに挽き、分量を増やしてドリップする", "n": ""}, {"c": 7, "q": "コーヒーの分量の基本の目安は？", "a": "150cc（1杯）に対して10g程度", "n": ""}, {"c": 7, "q": "1杯150ccだけをハンドドリップする時の粉量は？", "a": "10gより多め（15gなど）", "n": "粉の層が薄くお湯が早く落ちてしまうため。"}, {"c": 7, "q": "600ccをハンドドリップする時の粉量の目安は？", "a": "35g程度（40gだと濃いめ）", "n": ""}, {"c": 7, "q": "抽出時間とは？", "a": "コーヒー粉とお湯を触れさせている時間", "n": ""}, {"c": 7, "q": "ドリップ抽出で抽出時間を主に左右するのは？", "a": "メッシュとお湯を注ぐスピード", "n": ""}, {"c": 7, "q": "エスプレッソの抽出時間は？", "a": "20〜25秒", "n": "粉の量・メッシュ・適切なタンピングで調整する。"}, {"c": 7, "q": "ハンドドリップの抽出時間の目安（蒸らし後）は？", "a": "3〜4分ほど（抽出量によってあまり変えない）", "n": ""}, {"c": 7, "q": "コーヒーの苦味成分を挙げよ。", "a": "カフェイン、トリゴネリン、カラメル、褐色色素など", "n": ""}, {"c": 7, "q": "「良い苦味」と「嫌な苦味」の違いは？", "a": "良い苦味＝水に溶けやすく後を引かない、嫌な苦味＝水に溶けにくく舌に残り後を引く", "n": ""}, {"c": 7, "q": "「嫌な苦味」をおさえる4つのポイントは？", "a": "①温度を上げすぎない ②混ぜすぎない ③湯量・時間をオーバーしない ④メッシュを細かくしすぎない", "n": ""}, {"c": 7, "q": "アメリカンのような薄めのコーヒーをすっきり作るには？", "a": "適量で抽出したコーヒーを後からお湯で割る", "n": ""}, {"c": 7, "q": "カフェインの効果として言われているものを挙げよ。", "a": "眠気覚まし、脂肪燃焼促進、肝臓・腎臓のはたらきを活発にする（利尿作用）、消化促進", "n": ""}, {"c": 7, "q": "コーヒーポリフェノールと呼ばれる成分は？", "a": "クロロゲン酸（抗酸化作用）", "n": ""}, {"c": 7, "q": "コーヒーの中で鉄分と結合しやすい成分は？", "a": "タンニン", "n": "貧血気味の人は食後60分程度空けて飲むと良い。"}, {"c": 7, "q": "コーヒーの香りで「いい香り」と感じている時に脳から出るとされるものは？", "a": "アルファ波（リラックス状態）", "n": ""}, {"c": 8, "q": "コーヒー豆の鮮度を守る店舗での3つの基本は？", "a": "①納品後すぐに使用（販売） ②挽きたてを使用 ③淹れたてを提供", "n": ""}, {"c": 8, "q": "抽出後、何時間経過したコーヒーはお出しできない？", "a": "1時間", "n": ""}, {"c": 8, "q": "コーヒー豆の管理・4つのルールは？", "a": "①フレッシュローテーション ②都度挽き ③CDDA ④3-7-10ルール", "n": ""}, {"c": 8, "q": "フレッシュローテーションルールとは？", "a": "常に在庫を回転させ、古い豆が店舗で滞留しないように管理すること", "n": ""}, {"c": 8, "q": "フレッシュローテーションのための3つの取り組みは？", "a": "積極的な豆の販売、COD（本日のコーヒー）での使用、適切な発注・在庫管理", "n": ""}, {"c": 8, "q": "都度挽きルールとは？", "a": "CODを抽出する際は挽きたてを使用し、事前に挽いて置くことは禁止", "n": ""}, {"c": 8, "q": "COD用の豆はどのように保管する？", "a": "豆のままで小分けして保管し、抽出の直前に挽く", "n": ""}, {"c": 8, "q": "VMD棚でのビーンズ陳列の原則は？", "a": "先入れ先出し", "n": ""}, {"c": 8, "q": "シーズナルビーンズは遅くともいつまでに売り切ることを目指す？", "a": "次のシーズナルビーンズが導入される前まで", "n": ""}, {"c": 8, "q": "CDDAの4つを答えよ。", "a": "Cool（涼しい）・Dry（乾燥した）・Dark（暗い）・Airtight（密閉した）", "n": ""}, {"c": 8, "q": "CDDAの「Cool」で避けるべき保管場所の例は？", "a": "エスプレッソマシンの周りなど暑くなる場所", "n": ""}, {"c": 8, "q": "CDDAの「Dry」で避けるべき保管場所の例は？", "a": "シンク周りなど湿気の多い場所", "n": ""}, {"c": 8, "q": "CDDAの「Dark」の具体例は？", "a": "カウンターなどに出しっぱなしにせず戸棚に保管する", "n": ""}, {"c": 8, "q": "コーヒー劣化の原因となる4つのものは？", "a": "温度・湿気・光・酸素", "n": ""}, {"c": 8, "q": "3-7-10ルールの「3」とは？", "a": "挽いた豆をCODで使用できるのは挽いた日を含め3日まで", "n": ""}, {"c": 8, "q": "3-7-10ルールの「7」とは？", "a": "開封した豆を販売できるのは開封日を含め7日まで", "n": ""}, {"c": 8, "q": "3-7-10ルールの「10」とは？", "a": "開封した豆をCODで使用できるのは開封日を含め10日まで", "n": ""}, {"c": 8, "q": "3-7-10ルールより優先すべきルールは？", "a": "COD＝都度挽きルール、量り売り＝基本的に新しいものを開封して提供", "n": "3-7-10は最低限のルール。"}, {"c": 8, "q": "コーヒーの劣化で起こる主な2つのことは？", "a": "①香りの損失 ②オイルの酸化", "n": ""}, {"c": 8, "q": "コーヒーのでがらしが脱臭剤として使える理由は？", "a": "焙煎で内部に炭のような細かい空洞ができ、においを取り込む力があるため", "n": ""}, {"c": 8, "q": "家庭での保存期間の目安（挽いた豆・豆のまま）は？", "a": "挽いた豆は1週間程度、豆のままは2週間程度", "n": ""}, {"c": 8, "q": "冷蔵庫・冷凍庫で保存する際のリスクは？", "a": "温度差による結露、密閉が不十分だと匂いの吸収", "n": ""}, {"c": 8, "q": "毎日使うコーヒーのおすすめの保存方法は？", "a": "密閉して常温で、戸棚の中などに保管し早めに使う", "n": ""}, {"c": 8, "q": "長期保存に効果的な方法は？", "a": "冷凍保存（未開封か小分けにし密閉容器・チャック付き袋に入れる。使う時は常温に戻してから開封）", "n": ""}, {"c": 8, "q": "冷凍保存でかなり良い鮮度を保てる期間は？", "a": "数ヶ月〜半年くらい", "n": ""}, {"c": 9, "q": "ペーパーフィルターの特徴は？", "a": "余分なオイルや細かい粉をろ過し、クリアな味に仕上がりやすい。手入れも簡単", "n": ""}, {"c": 9, "q": "ペーパーフィルター（ハンドドリップ）の挽き方は？", "a": "中挽き程度（D6.5〜7.0）", "n": ""}, {"c": 9, "q": "ペーパーフィルターのとじしろの折り方は？", "a": "側面と底面をそれぞれ逆の方へ折る", "n": ""}, {"c": 9, "q": "ハンドドリップの蒸らし時間は？", "a": "30〜60秒ほど（アイスコースでは30〜40秒）", "n": "湯量はポタポタ落ち始めるくらい。"}, {"c": 9, "q": "蒸らし後の注ぎ方は？", "a": "中心に小さめに「の」の字や円を描くように、4〜5回に分けてゆっくり水面を上げる", "n": ""}, {"c": 9, "q": "ハンドドリップで崩してはいけないものは？", "a": "コーヒー粉の土手", "n": ""}, {"c": 9, "q": "土手が崩れるとコーヒーはどうなる？", "a": "お湯が粉の層を通らずに出ていき、薄くなる", "n": ""}, {"c": 9, "q": "ハンドドリップでドリッパー内のお湯を最後まで切らさない理由は？", "a": "水面の泡（アクのようなもの）を落とさないため", "n": "適量になったらお湯が残ったままドリッパーを外す。"}, {"c": 9, "q": "数杯分を作った時、最後にすることは？", "a": "くるくるかき回す（下のほうが濃いめにかたよるため）", "n": ""}, {"c": 9, "q": "コーヒーアドバイザーの取得に実演できる必要がある抽出方法2つは？", "a": "ハンドドリップとフレンチプレス", "n": ""}, {"c": 9, "q": "1つ穴ドリッパーを考案したとされるメーカーは？", "a": "メリタ社（3つ穴はカリタ式）", "n": ""}, {"c": 9, "q": "1つ穴ドリッパーのメリットとデメリットは？", "a": "コツがいらず味が変わりにくい／抽出時間が長くなり苦くなることがある（やや粗めの粉でバランスを取る）", "n": ""}, {"c": 9, "q": "タリーズオリジナルドリッパーの穴の数は？", "a": "2つ", "n": ""}, {"c": 9, "q": "タリーズオリジナルドリッパーのコンセプトは？", "a": "「誰でも美味しく」（初心者でも失敗しにくい構造）", "n": ""}, {"c": 9, "q": "オリジナルドリッパーが3つ穴よりやや濃いめに仕上がる理由は？", "a": "口径と容量がやや小さく、粉の層が厚くなるため", "n": ""}, {"c": 9, "q": "オリジナルドリッパーで濃く感じる場合はどうする？", "a": "メッシュを粗めにしてバランスを取る", "n": ""}, {"c": 9, "q": "オリジナルドリッパーの挽き方は？", "a": "中細挽き〜中挽き（D6.5〜8.0）", "n": ""}, {"c": 9, "q": "オリジナルドリッパーにタリーズのペーパーフィルターを使う時のコツは？", "a": "サイドを少し太めに折るとフィットする", "n": ""}, {"c": 9, "q": "V60はどこのメーカーの、どんな形状のドリッパー？", "a": "ハリオ社の円錐形（リブがらせん状、大きな1つ穴）", "n": ""}, {"c": 9, "q": "V60でゆっくり注ぐとどんな味わいに近くなる？", "a": "ネルドリップに近いこってりとした味わい", "n": ""}, {"c": 9, "q": "メタルドリッパーの味わいの特徴は？", "a": "オイルも抽出され、まろやかでボディ感のある仕上がり", "n": ""}, {"c": 9, "q": "タリーズメタルドリッパーの挽き方は？", "a": "中挽き（D8.0、G4.0）", "n": ""}, {"c": 9, "q": "メタルドリッパーで1杯分を淹れる分量の目安は？", "a": "20g/150cc（2杯30g/300cc、3杯40g/450cc）", "n": ""}, {"c": 9, "q": "メタルドリッパーの構造は？", "a": "超微細メッシュを2枚重ねた構造", "n": ""}, {"c": 9, "q": "メタルドリッパーで注ぐ時のポイントは？", "a": "お湯は細めに丁寧に、注ぐ円は小さめにして中心を意識する", "n": ""}, {"c": 9, "q": "メタルドリッパーやタリーズドリップマスターは、どこの製品をタリーズ仕様にカスタマイズしたもの？", "a": "Bodum社", "n": ""}, {"c": 9, "q": "フレンチプレス（コーヒープレス）の挽き方は？", "a": "粗挽き（D9.0）", "n": ""}, {"c": 9, "q": "フレンチプレスの浸け込み時間は？", "a": "4分", "n": "蒸らし約30秒（フタをする）→お湯を注ぎ表面を軽く混ぜる→フタをして4分→プレス。"}, {"c": 9, "q": "フレンチプレスの分量の目安は？", "a": "150ccにつき10g（20g/300cc、30g/400cc、40g/600cc）", "n": ""}, {"c": 9, "q": "フレンチプレスで複数のカップに注ぐ時の注ぎ方は？", "a": "お茶のように半分ずつ A→B→C→C→B→A", "n": ""}, {"c": 9, "q": "浸け込みタイプは苦く濃いと言える？", "a": "いいえ。粗めの粉なのでむしろ苦みは出にくく、オイルで甘味やまろやかさを感じやすい", "n": ""}, {"c": 9, "q": "ワンカップコーヒーメーカーの挽き方と分量は？", "a": "粗挽き（D9.0、G4.5）、16〜20g程度", "n": ""}, {"c": 9, "q": "ワンカップコーヒーメーカーの手順は？", "a": "カップを温め粉を入れる→約30秒蒸らす（フタ）→取っ手の上端まで約200cc注ぐ→フタをして4分", "n": ""}, {"c": 9, "q": "タリーズドリップマスターの挽き方と分量は？", "a": "粗挽き（D9.0）、1回20g程度", "n": ""}, {"c": 9, "q": "タリーズドリップマスターの特徴は？", "a": "メタルメッシュフィルターでペーパーとプレスの良さを持つ。下がカップになっている", "n": ""}, {"c": 9, "q": "ドリップマスターで鮮度の悪い粉を使うとどうなる？", "a": "粉が膨らまずお湯が早く落ちて薄くなる（粉を多めにして調整）", "n": ""}, {"c": 9, "q": "水出しコーヒーポットの挽き方は？", "a": "細挽き（D5.5）", "n": ""}, {"c": 9, "q": "タリーズの水出しポットの分量は？", "a": "50g/600ml、80g/1000ml", "n": ""}, {"c": 9, "q": "水出しポットで冷蔵庫に寝かせる時間は？", "a": "8時間程度", "n": ""}, {"c": 9, "q": "水出しコーヒーを考案したのは何人と言われ、何と呼ばれる？", "a": "オランダ人、ダッチコーヒー", "n": ""}, {"c": 9, "q": "水出しはもともと何のために考えられた？", "a": "苦味の強いインドネシアのロブスタを飲みやすくするため", "n": ""}, {"c": 9, "q": "サイフォンの挽き方と特徴は？", "a": "中細挽き（D6.0）。抽出温度が高く濃く苦め、抽出過程を目で楽しめる", "n": ""}, {"c": 9, "q": "サイフォンの下の丸い部分と上の筒状の部分の名称は？", "a": "下＝フラスコ、上＝ロート", "n": ""}, {"c": 9, "q": "ネルドリップの挽き方と特徴は？", "a": "中挽き（D7.0）。こってりとした仕上がりで舌触りがなめらか", "n": ""}, {"c": 9, "q": "ネルフィルターの起毛面はどちら側にする？", "a": "外側", "n": ""}, {"c": 9, "q": "布フィルター（サイフォン・ネル）の管理方法は？", "a": "水に浸けて冷蔵保管、煮沸消毒など", "n": ""}, {"c": 9, "q": "モカポット（マキネッタ）の挽き方と特徴は？", "a": "極細挽き（D3.0）。エスプレッソに近い濃厚な味わい（イタリアの家庭の定番）", "n": ""}, {"c": 9, "q": "パーコレーターの挽き方と特徴は？", "a": "粗挽き（D8.0〜9.0）。抽出液を沸騰させ続けるため味は落ちる（主にキャンプ用品）", "n": ""}, {"c": 9, "q": "トルココーヒーを淹れる器具は？", "a": "イブリック", "n": "現代のコーヒー抽出の原点ともいわれ、「コーヒー占い」もある。"}, {"c": 9, "q": "ベトナム式フィルターでよく一緒に使われるものは？", "a": "コンデンスミルク", "n": "フランス領時代にカフェオレ文化が入ったが、生乳が手に入りにくかったため。"}, {"c": 9, "q": "コーヒーケトルを使う理由（おいしく淹れるコツ）は？", "a": "熱湯を「細くゆっくりと注ぐ」ため", "n": ""}, {"c": 9, "q": "タリーズコーヒーケトルを長持ちさせる使い方は？", "a": "直火を避け、別で沸かしたお湯を移し替えて注ぎ専用で使う（IH対応）", "n": ""}, {"c": 9, "q": "タリーズコーヒーミルのハンドルはどちらに回す？", "a": "右回転（逆回転は臼が削れることがある）", "n": ""}, {"c": 9, "q": "タリーズコーヒーミルの臼の素材は？", "a": "セラミック臼（ステンレスパーツで分解・丸洗い可）", "n": ""}, {"c": 9, "q": "コーヒーミルで細かくするには粗さ調整ナットをどちらに回す？", "a": "右回り（臼が閉じる）。粗くするには左回り", "n": ""}, {"c": 10, "q": "抽出で味わいを調整するベースとなる4つの条件は？", "a": "①温度 ②分量（粉の量と抽出量） ③メッシュ ④抽出時間", "n": ""}, {"c": 10, "q": "コーヒーを薄くする（成分を出にくくする）4つの方法は？", "a": "温度を下げる・粉を減らす・粗挽きにする・抽出時間を短く", "n": ""}, {"c": 10, "q": "コーヒーを濃くする（成分を出やすくする）4つの方法は？", "a": "温度を上げる・粉を増やす・細挽きにする・抽出時間を長く", "n": ""}, {"c": 10, "q": "低温や粗挽きでも抽出されやすい味の成分は？", "a": "酸味や甘味", "n": ""}, {"c": 10, "q": "温度を上げたり細挽きにするほど増える成分は？", "a": "苦味や雑味、香りの成分", "n": ""}, {"c": 10, "q": "抽出液が濃すぎると豆の特徴の感じ方はどうなる？", "a": "分かりにくくなる", "n": ""}, {"c": 10, "q": "抽出レシピを考える時の2つのテーマは？", "a": "①豆の特徴をどう引き出すか ②飲む人の好みや飲み方にどう合わせるか", "n": ""}, {"c": 10, "q": "フルーティ・さわやかな豆で苦味を抑えたい時のレシピのヒントは？", "a": "ペーパーでクリアに、基本より粗め、温度84℃前後、粉量・注ぎは基本通り", "n": ""}, {"c": 10, "q": "フルボディ・チョコレート・スモーキーな豆で深みを出したい時のレシピのヒントは？", "a": "メタルドリッパー、挽きは基本通り、88℃程度、粉量やや多め、注ぎはややゆっくり", "n": ""}, {"c": 10, "q": "深煎りの豆をすっきり飲みやすくしたい時のレシピのヒントは？", "a": "ペーパー、粗挽き（プレス程度）、粉量やや多め、蒸らし88℃・抽出82〜84℃", "n": ""}, {"c": 10, "q": "まろやかにしたい時のレシピのヒントは？", "a": "プレスやメタルでオイルをプラス、温度84℃程度、分量は基本通り", "n": ""}, {"c": 10, "q": "おいしいカフェオレを作る時のコーヒーとミルクの比率の目安は？", "a": "1:1", "n": ""}, {"c": 10, "q": "ラテやカフェモカのイメージにする時のコーヒーとミルクの比率の目安は？", "a": "3:7（コーヒーエキスのようにかなり濃く抽出）", "n": ""}, {"c": 11, "q": "アイスコーヒー抽出で一番のポイントは？", "a": "急冷", "n": ""}, {"c": 11, "q": "アイスコーヒーで使う氷の量の目安は？", "a": "出来上がり量の40%程度", "n": ""}, {"c": 11, "q": "600mlのアイスコーヒーを作る場合の氷の量は？", "a": "240g程度（コーヒー約360cc）", "n": ""}, {"c": 11, "q": "アイスコーヒーの粉量の目安はホットの何倍？", "a": "1.5倍程度（600ccで50g程度）", "n": ""}, {"c": 11, "q": "アイスコーヒーコースの基本の抽出量は？", "a": "50g/600cc、氷240g程度", "n": "少人数なら25g/300cc/氷120g（粉1:お湯12）。"}, {"c": 11, "q": "オリジナルドリッパーでアイスを淹れる時の粉量の上限は？", "a": "最大50g", "n": ""}, {"c": 11, "q": "アイスコーヒーで「急冷」する理由は？", "a": "湯気と一緒に香りが逃げるのを防ぎ、香りや美味しさを閉じ込めるため", "n": ""}, {"c": 11, "q": "アイスコーヒーの注ぎ方でホットと違う点は？", "a": "ホットよりさらに細くじっくり注ぐ。注ぐ範囲はやや広め、フィルターの縁ギリギリまで水位を上げる（土手は崩さない）", "n": ""}, {"c": 11, "q": "淹れたてと冷蔵庫で1〜2時間寝かせたアイスコーヒーの印象の違いは？", "a": "淹れたてはキリッとシャープ、寝かせるとトロッとまろやか", "n": ""}, {"c": 11, "q": "家庭で作ったアイスコーヒーは冷蔵庫で何日くらい美味しく飲める？", "a": "2日程度（ラップをかける）", "n": ""}, {"c": 11, "q": "アイスコーヒーに一般的に深煎りが使われる理由は？", "a": "冷やすと酸味を強く感じやすいため、冷やしても香ばしさや深みを感じられる深煎りが使われる", "n": ""}, {"c": 11, "q": "タリーズのアイスコーヒーブレンドは何の次に深煎り？", "a": "フレンチロースト", "n": ""}, {"c": 11, "q": "アイスカフェオレ派におすすめのタリーズのビーンズは？", "a": "フレンチロースト、エスプレッソクラシコなど（深煎りでフルボディ）", "n": ""}, {"c": 11, "q": "すっきりフルーティなアイスコーヒーが好みの方へのおすすめは？", "a": "エチオピア、キリマンジャロ、コスタリカなど（Mild）", "n": ""}, {"c": 11, "q": "電気ケトルで沸騰直後のお湯をケトルに移した直後の温度は？", "a": "92〜93℃程度（さらに1〜2分置くとちょうど良い）", "n": ""}, {"c": 11, "q": "水出しコーヒーの英語名は？", "a": "COLD BREW（コールドブリュー）", "n": ""}, {"c": 11, "q": "水出しコーヒーの味わいの特徴は？", "a": "苦味や雑味が抑えられ、まろやかで甘味を感じやすい", "n": ""}, {"c": 11, "q": "水出しコーヒーの2つの作り方は？", "a": "点滴のようにポタポタとドリップする（ウォータードリップ）か、水に粉を漬け込んで濾す", "n": ""}, {"c": 11, "q": "アイスコーヒーコースのテーマは？", "a": "「アイスコーヒーを楽しもう」", "n": ""}, {"c": 11, "q": "アイスコーヒーコースのプログラムの時間は？", "a": "約90分", "n": ""}, {"c": 11, "q": "アイスコーヒーコースでお客様が抽出するのは何回？", "a": "1回のみ（3名以上は2組に分かれて抽出）", "n": ""}, {"c": 11, "q": "アイスコーヒーコースで飲み比べる2種類の豆は？", "a": "アイスコーヒーブレンドとシーズナルビーンズ", "n": ""}, {"c": 11, "q": "アイスコーヒーブレンドにおすすめのケーキは？", "a": "ベイクドチーズケーキ", "n": ""}, {"c": 11, "q": "アイスコーヒーコースの3つのアレンジコーヒーは？", "a": "アイスバニララテ、アイスカフェモカ、アイスハニーミルクラテ", "n": ""}, {"c": 11, "q": "自宅等で作ったものをスクールの試飲としてお客様に提供してよい？", "a": "いいえ。試飲は店舗で作成する", "n": ""}, {"c": 11, "q": "コーヒースクール参加当日の特典は？", "a": "ビーンズ＆グッズが10%OFF", "n": ""}, {"c": 11, "q": "コーヒースクール参加時のスタンプカードの捺印数は？", "a": "2個", "n": ""}, {"c": 11, "q": "ドリッパーの粉の上に氷をのせ、自然に溶けるのを待つ抽出方法は？", "a": "アイスドリップ（ウォータードリップに近い仕上がり）", "n": ""}, {"c": 11, "q": "お気に入りの豆がアイスに物足りない時、少し混ぜて深みを加えるとよい豆は？", "a": "フレンチロースト（1〜3割程度）", "n": ""}, {"c": 12, "q": "テイスティングの3ステップは？", "a": "①カップに鼻を近づけ香りを吸い込む ②口に含み舌全体に広げる ③口に含んだまま鼻で息を出し入れする", "n": ""}, {"c": 12, "q": "テイスティングワード（味わいの表現）の要素を挙げよ。", "a": "アロマ、フレーバー、アシディティ（酸味）、ボディ（コク）、後味・余韻", "n": ""}, {"c": 12, "q": "アロマとは？", "a": "カップから立ちのぼる香り", "n": ""}, {"c": 12, "q": "抽出前の挽いた状態の豆の香りを何と呼ぶ？", "a": "フレグランス", "n": ""}, {"c": 12, "q": "フレーバーとは？", "a": "口の中に広がる香りと味わい（風味）", "n": ""}, {"c": 12, "q": "アシディティ（酸味）とは？", "a": "さわやかさ、すっきり感（舌の側面で感じやすい）", "n": ""}, {"c": 12, "q": "ボディ（コク）とは？", "a": "液体の密度、質感、食感", "n": ""}, {"c": 12, "q": "ボディの強弱を例えると何と何？", "a": "強い＝濃厚なミルク、弱い＝水（ワインのライトボディ／フルボディにも似る）", "n": ""}, {"c": 12, "q": "コーヒー豆の味わいを3つの単語で表現したものを何と呼ぶ？", "a": "スリーキーワード（テイスティングワード）", "n": ""}, {"c": 12, "q": "ハウスブレンドのスリーキーワードは？", "a": "Balanced・Smooth・Bright", "n": ""}, {"c": 12, "q": "テイスティングワード「Winy」の意味は？", "a": "ワインのような", "n": ""}, {"c": 12, "q": "テイスティングワード「Earthy」の意味は？", "a": "大地のような", "n": ""}, {"c": 12, "q": "テイスティングワード「Brisk」の意味は？", "a": "爽やかな", "n": ""}, {"c": 12, "q": "フードペアリングの基本セオリーは？", "a": "コーヒーのイメージに近いものと合わせる", "n": ""}, {"c": 12, "q": "酸味があり飲みやすいバランスの良いコーヒーに合わせやすいフードは？", "a": "ビスケット、クッキー、クロワッサン、トースト、サンドイッチ、ナッツ類、あんこのお菓子、せんべいなど", "n": ""}, {"c": 12, "q": "深いボディで重量感のあるコーヒーに合わせやすいフードは？", "a": "クリームやバターたっぷりのケーキ、チョコレート、甘いドーナツ、黒糖かりんとうなど", "n": ""}, {"c": 12, "q": "華やかな香りとフルーティな酸味のコーヒーに合わせやすいフードは？", "a": "イチゴのショートケーキ、フルーツタルト、アップルパイ、ドライフルーツの焼き菓子など", "n": ""}, {"c": 12, "q": "こってりした料理の後に合うコーヒーは？", "a": "深煎りや重量感のあるコーヒー（あっさりした料理の後は浅煎りや中南米）", "n": ""}, {"c": 12, "q": "クセがなくコーヒーの味の邪魔になりにくい砂糖は？", "a": "グラニュー糖や氷砂糖", "n": ""}, {"c": 12, "q": "グラニュー糖にカラメルを混ぜて結晶化した砂糖は？", "a": "コーヒーシュガー", "n": ""}, {"c": 12, "q": "ガムシロップがアイスコーヒーに使われる理由は？", "a": "溶けやすいため（糖度は同量のグラニュー糖より低い）", "n": ""}, {"c": 12, "q": "濃いめや深煎りのコーヒーに合うクリームは？", "a": "動物性クリーム", "n": "植物性クリームはあっさりしており、マイルド・浅煎りに合う。"}, {"c": 12, "q": "コーヒーフレッシュ（ポーション）の多くは何でできている？", "a": "植物性クリーム", "n": ""}, {"c": 12, "q": "空腹時のコーヒーで胃が荒れやすい場合のおすすめは？", "a": "カフェオレ（ミルクの脂分が胃壁をカバー）", "n": ""}, {"c": 12, "q": "コーヒーをストレートに味わうためのカップの色は？", "a": "内側が白か薄い色", "n": ""}, {"c": 12, "q": "マイルド・すっきり・フルーティな味わいに合うカップの厚さは？", "a": "薄手（どっしりめやカフェオレには厚手）", "n": ""}, {"c": 13, "q": "タリーズのビーンズの3つのカテゴリー（味わいの分類）は？", "a": "MILD・MEDIUM・FULL BODY", "n": ""}, {"c": 13, "q": "MILDカテゴリーの味わいの特徴は？", "a": "すっきり、飲みやすい", "n": ""}, {"c": 13, "q": "MEDIUMカテゴリーの味わいの特徴は？", "a": "ほどよい深み", "n": ""}, {"c": 13, "q": "FULL BODYカテゴリーの味わいの特徴は？", "a": "深いコク、飲みごたえ", "n": ""}, {"c": 13, "q": "MILDの中で一番軽やかな味わいのビーンズは？", "a": "ピッコロバンビーノ", "n": ""}, {"c": 13, "q": "FULL BODYの中で、やわらかさもありブラックでも飲みやすい2つは？", "a": "ブラックスリーとカフェオレモナーレ", "n": ""}, {"c": 13, "q": "ハウスブレンドのカテゴリーと原産国は？", "a": "MILD、コロンビア・グァテマラ他", "n": ""}, {"c": 13, "q": "ハウスブレンドの商品特長は？", "a": "マイルド＆スムース。程よいボディと明るい酸味、中南米産のブレンドですっきり飲みやすい", "n": ""}, {"c": 13, "q": "ハウスブレンドのセールスワード（赤字）は？", "a": "程よいボディとすっきり感", "n": ""}, {"c": 13, "q": "ピッコロバンビーノの原産国は？", "a": "グァテマラ、パプアニューギニア他", "n": ""}, {"c": 13, "q": "ピッコロバンビーノのスリーキーワードは？", "a": "Mild・Caramel・Balanced", "n": ""}, {"c": 13, "q": "ピッコロバンビーノのセールスワード（赤字）は？", "a": "すっきり爽やか（モーニングコーヒーにぴったり）", "n": ""}, {"c": 13, "q": "ブラジル（バウ）のカテゴリーとスリーキーワードは？", "a": "MEDIUM、Nutty・Sweet・Balanced", "n": ""}, {"c": 13, "q": "ブラジル（バウ）の商品特長は？", "a": "濃縮された甘味。しっかりとしたコクと広がる甘み、ナッツやピーナッツのようなフレーバー", "n": ""}, {"c": 13, "q": "ブラジル（バウ）のパッケージのイラストは？", "a": "トゥッカーノ（ブラジルイエロー）", "n": ""}, {"c": 13, "q": "ブラジルのセールスワード（赤字）は？", "a": "程よいコク、コーヒーの自然な甘み（ハチミツとの相性が良い）", "n": ""}, {"c": 13, "q": "モカジャバのカテゴリーと原産国は？", "a": "MEDIUM、インドネシア・エチオピア", "n": ""}, {"c": 13, "q": "モカジャバのスリーキーワードは？", "a": "Deep・Rich・Winy", "n": ""}, {"c": 13, "q": "モカジャバの商品特長は？", "a": "芳醇な香りと風味。エチオピア・モカフレーバーの妖艶な香り、フルボディの赤ワインを感じさせる口当たり", "n": ""}, {"c": 13, "q": "モカジャバのパッケージのイラストは？", "a": "ラクダ", "n": ""}, {"c": 13, "q": "モカジャバのセールスワード（赤字）は？", "a": "まるでワインのような風味（スイーツにぴったり）", "n": ""}, {"c": 13, "q": "ブラックスリーのカテゴリーと原産国は？", "a": "FULL BODY、コロンビア・ペルー", "n": ""}, {"c": 13, "q": "ブラックスリーのスリーキーワードは？", "a": "Rich・Caramel・Balanced", "n": ""}, {"c": 13, "q": "ブラックスリーのセールスワード（赤字）は？", "a": "ブラック派の方におすすめ（リッチなコク）", "n": ""}, {"c": 13, "q": "カフェオレモナーレのカテゴリーと原産国は？", "a": "FULL BODY、グァテマラ・コロンビア他", "n": ""}, {"c": 13, "q": "カフェオレモナーレのスリーキーワードは？", "a": "Floral・Rich・Sweet", "n": ""}, {"c": 13, "q": "カフェオレモナーレの商品特長は？", "a": "ミルクとの相性がぴったり。ミルクに負けないしっかりとしたコク、花のような華やかな香り", "n": ""}, {"c": 13, "q": "エスプレッソクラシコのカテゴリーと原産国は？", "a": "FULL BODY、グァテマラ・コスタリカ他", "n": ""}, {"c": 13, "q": "エスプレッソクラシコのスリーキーワードは？", "a": "Sweet・Rich・Nutty", "n": ""}, {"c": 13, "q": "エスプレッソクラシコのセールスワードで、シーンについての説明は？", "a": "お店のカフェラテなどのベースで使用中", "n": ""}, {"c": 13, "q": "フレンチローストの原産国は？", "a": "グァテマラ、タンザニア", "n": ""}, {"c": 13, "q": "フレンチローストのスリーキーワードは？", "a": "Rich・Smoky・Spicy", "n": ""}, {"c": 13, "q": "フレンチローストのボディとアシディティの数値は？", "a": "ボディ4.5、アシディティ1（最もボディが強い）", "n": ""}, {"c": 13, "q": "フレンチローストのパッケージのイラストは？", "a": "エッフェル塔", "n": ""}, {"c": 13, "q": "エチオピアモカ G1 ウラガ ナチュラルのスリーキーワードは？", "a": "Raspberry・Floral・Bright", "n": ""}, {"c": 13, "q": "エチオピアモカ G1 ウラガ ナチュラルはエチオピアのどのエリアの豆？", "a": "シダモエリア・ウラガ地区（小規模生産者）", "n": ""}, {"c": 13, "q": "エチオピアのパッケージでアイコンになっている動物は？", "a": "ヤギ（エチオピア豆の象徴）", "n": ""}, {"c": 13, "q": "エチオピアのセールスワード（赤字）は？", "a": "ベリーのようなフルーティな風味（リラックスタイムに）", "n": ""}, {"c": 13, "q": "キリマンジャロ KIBO タリメ スイートウォッシュドのスリーキーワードは？", "a": "Juicy・Round・Complex", "n": ""}, {"c": 13, "q": "コスタリカ ラ ミニータのスリーキーワードは？", "a": "Clean・Smooth・Bright", "n": ""}, {"c": 13, "q": "コスタリカ ラ ミニータの商品特長は？", "a": "シトラス系の風味と優しい甘み。チョコレートやカラメル、花のようなアロマ", "n": ""}, {"c": 13, "q": "コスタリカのパッケージに描かれている幻の鳥は？", "a": "ケツァール", "n": ""}, {"c": 13, "q": "コスタリカのセールスワード（赤字）は？", "a": "爽やかな風味（軽やかな口あたり、モーニングにおすすめ）", "n": ""}, {"c": 13, "q": "デカフェ ブラジルIP農園のスリーキーワードは？", "a": "Caramel・Sweet・Soft", "n": ""}, {"c": 13, "q": "デカフェのセールスワード（赤字）は？", "a": "軽やかで優しいデカフェ（夜、眠る前でも安心）", "n": ""}, {"c": 13, "q": "1杯ずつマグで手軽に抽出できる個包装の商品は？", "a": "ZIPS（シングルサーブ）", "n": ""}, {"c": 13, "q": "プレゼントや手土産でZIPSをすすめやすい理由は？", "a": "マグカップやお菓子と組み合わせやすく、個包装でシェアできる", "n": ""}, {"c": 14, "q": "ビーンズ販売とは何のお手伝い？", "a": "お客様のコーヒー探しのお手伝い", "n": ""}, {"c": 14, "q": "ビーンズ販売の基本フロー3段階は？", "a": "ファーストコンタクト → コミュニケーション → クロージング応対", "n": ""}, {"c": 14, "q": "ビーンズ販売のどのステップでもテーマにすることは？", "a": "「感じの良さ」", "n": ""}, {"c": 14, "q": "ファーストコンタクトで目指す第一印象は？", "a": "「この人なら話しやすそう」「この人なら嫌じゃないな」と感じてもらうこと", "n": ""}, {"c": 14, "q": "ファーストコンタクトのあいさつは？", "a": "「こんにちは」＋「ご来店ありがとうございます」", "n": ""}, {"c": 14, "q": "「何かお探しですか？」より先にすることは？", "a": "コーヒーの試飲をすすめる（持っていく）", "n": ""}, {"c": 14, "q": "ビーンズ販売時のコミュニケーションで目指すのは？", "a": "購入後の満足とリピート", "n": ""}, {"c": 14, "q": "販売時のコミュニケーションの4つのポイントは？", "a": "①お客様のことを知る ②お客様に合わせた提案 ③コーヒーショップならではの情報提供 ④安心感や楽しい雰囲気づくり", "n": ""}, {"c": 14, "q": "お客様の好みを伺う最初の質問は？", "a": "「どのような味わいがお好みですか？」", "n": ""}, {"c": 14, "q": "一般的に、滞在時間が長いほど何がアップすると言われる？", "a": "購買率", "n": ""}, {"c": 14, "q": "商品提案は何種類くらいから選んでいただくと満足度が上がりやすい？", "a": "2つくらい（1種類だけより）", "n": ""}, {"c": 14, "q": "プレゼントの場合、最初に伺うとスムーズなことは？", "a": "ご予算", "n": ""}, {"c": 14, "q": "プレゼントにおすすめしやすいビーンズは？", "a": "ハウスブレンド（どなたにも好まれやすい）やシーズナルビーンズ（パッケージも華やか）", "n": ""}, {"c": 14, "q": "おすすめに理由を添える時の言い方の型は？", "a": "「〇〇ので」（例：すっきりしているので朝でも飲みやすい）", "n": ""}, {"c": 14, "q": "相手の言った言葉をそのまま返す、共感を表す聴き方は？", "a": "オウム返し", "n": ""}, {"c": 14, "q": "クロージング応対で手提げ袋は何を使う？", "a": "ペーパーバッグ", "n": ""}, {"c": 14, "q": "お見送りはどこまで行う？", "a": "なるべく入口まで", "n": ""}, {"c": 14, "q": "クロージング応対で心掛けるあいさつは？", "a": "「ありがとうございます＋ひとこと」", "n": ""}, {"c": 14, "q": "コーヒーの試飲活動の目的は？", "a": "タリーズの美味しさを伝える「体験」（ファンを増やす活動。販売につながらなくてもOK）", "n": ""}, {"c": 14, "q": "試飲活動を行う4つの場所・シーンは？", "a": "VMD（商品棚）、店内（客席）、セルフ（ポット）、店頭", "n": ""}, {"c": 14, "q": "VMD（商品棚）でビーンズを見ているお客様には何をする？", "a": "必ず試飲を提供する", "n": ""}, {"c": 14, "q": "VMDでの試飲の量の目安は？", "a": "試飲カップ半分程度の本日のコーヒー", "n": ""}, {"c": 14, "q": "VMDでの接客の流れは？", "a": "あいさつ〜試飲 → コーヒーの紹介 → 好みやニーズの確認 → 商品の提案〜購入 → レジへのご案内", "n": ""}, {"c": 14, "q": "VMDで好みに合いそうな商品は何個紹介する？", "a": "1〜2個", "n": ""}, {"c": 14, "q": "セルフ（ポット）試飲で使う試飲カップは？", "a": "HOT：3ozホットカップ、ICE：3ozコールドカップ", "n": ""}, {"c": 14, "q": "試飲で使用期限が切れたCODをポットに入れて使ってよい？", "a": "いいえ（ポットに入れても使用期限は同じ）", "n": ""}, {"c": 14, "q": "シーズナル発売前に納品される試飲用の豆は？", "a": "サンプルビーンズ", "n": ""}, {"c": 14, "q": "店頭試飲で、イベント感を上げ興味を高める方法は？", "a": "ハンドドリップやコーヒープレスで実演する", "n": ""}], "cz": [{"c": 0, "t": "経営理念は「一杯のコーヒーを通じて、｢[[お客様]]｣、｢[[フェロー]]｣、｢[[社会]]｣に新しい価値を創造し、共に成長する」。"}, {"c": 0, "t": "経営理念の1つ目は「その一杯に[[心を込める]]」。"}, {"c": 0, "t": "経営理念の2つ目は「お客様の期待を[[超越する]]」。"}, {"c": 0, "t": "経営理念の3つ目は「地域社会に根ざした[[コミュニティーカフェ]]となる」。"}, {"c": 0, "t": "経営理念の4つ目は「最高の仕事が経験できて、[[一人一人の可能性]]が広がる職場をつくる」。"}, {"c": 0, "t": "経営理念の5つ目は「[[子ども達や青少年]]の成長を促すために、夢や目標のお手伝いをする」。"}, {"c": 0, "t": "タリーズでは[[行動指針]]として経営理念を大切にしている。"}, {"c": 0, "t": "運営ポリシー「5つの最高」は、最高の[[豆]]・最高の[[焙煎]]・最高の[[バリスタ]]・最高の[[ホスピタリティ]]・そして最高の…！"}, {"c": 0, "t": "「最高の豆」：バイヤーが世界中の原産地へ行き、厳選された[[アラビカ種]]を使用。"}, {"c": 0, "t": "「最高の焙煎」：[[国内焙煎]]によって、より鮮度の高いコーヒー豆をお客様に届けられる。"}, {"c": 0, "t": "「最高のバリスタ」：お客様に喜んでいただくために必要な[[技術]]、[[知識]]、[[接客スキル]]を習得する。"}, {"c": 0, "t": "「最高のホスピタリティ」：[[おもてなしの心]]、思いやりを持ってお客様と接し、その気持ちを[[行動]]に移す。"}, {"c": 0, "t": "「そして最高の・・・！」：フェロー一人一人が毎日[[目標]]を立て、最高の何かをお客様に提供する。"}, {"c": 0, "t": "QHCの Q＝[[Quality（クオリティ）]]：商品の品質の良さ。"}, {"c": 0, "t": "QHCの H＝[[Hospitality（ホスピタリティ）]]：おもいやり、おもてなしの心。"}, {"c": 0, "t": "QHCの C＝[[Cleanliness（クレンリネス）]]：清潔さ、衛生的な空間の維持。"}, {"c": 0, "t": "QHCはどれか一つではなく、[[全て]]が高い次元で実現できてこそお客様の満足は向上する。"}, {"c": 0, "t": "QHCは[[お客様満足]]向上のための店舗運営の指標の一つである。"}, {"c": 0, "t": "タリーズの挨拶の気持ちは『[[HELLO FELLOW]]』。"}, {"c": 0, "t": "HELLO FELLOWで伝える気持ちは、①人を好きになり[[感謝]]する気持ち ②人を[[尊敬]]する気持ち ③[[タリーズを好き]]な気持ち。"}, {"c": 0, "t": "タリーズコーヒーは[[1992]]年、米国[[シアトル]]で創業した。"}, {"c": 0, "t": "創業者は不動産会社を営む[[トム・タリー・オキーフ]]。"}, {"c": 0, "t": "タリーズはシアトル発祥の[[セカンドウェーブ]]と呼ばれるコーヒームーブメントの中で生まれた。"}, {"c": 0, "t": "日本の第1号店は[[1997]]年8月オープンの「[[銀座店]]」。"}, {"c": 0, "t": "タリーズコーヒージャパン株式会社の設立は[[1998]]年5月。"}, {"c": 0, "t": "[[2000]]年、フランチャイズ事業を開始。"}, {"c": 0, "t": "2001年10月、米国Tully's Coffee Corporationから日本国における[[コーヒー豆の焙煎と卸売]]の権利を取得。"}, {"c": 0, "t": "2004年4月、病院内1号店となる「[[好仁会東大病院店]]」オープン。"}, {"c": 0, "t": "2005年8月、日本における「Tully's Coffee」[[商標権]]を完全取得。"}, {"c": 0, "t": "2006年11月、株式会社[[伊藤園]]グループとなる。"}, {"c": 0, "t": "2014年、全国[[47]]都道府県に出店（555号店「鳥取大学医学部附属病院店」）。"}, {"c": 0, "t": "2017年8月、創業[[20]]周年を迎える。"}, {"c": 0, "t": "100号店は「[[小田原ダイナシティ店]]」、500号店は「[[歌舞伎座店]]」。"}, {"c": 0, "t": "800号店は2024年7月オープンの「[[KITTE大阪店]]」。"}, {"c": 0, "t": "タリーズの商品カテゴリーには、本日のコーヒー、[[エスプレッソビバレッジ]]、ティービバレッジ、[[スワークル®]]バレッジ、ビーンズなどがある。"}, {"c": 1, "t": "元気の良い明るいあいさつの店舗では、お客様は[[ポジティブ]]な気持ちに、あいさつのない店舗では[[ネガティブ]]な気持ちになる。"}, {"c": 1, "t": "3つのあいさつは、①[[お迎え]]のあいさつ ②[[レジ]]でのあいさつ ③[[お見送り]]のあいさつ。"}, {"c": 1, "t": "お迎えのあいさつは[[みんなで]]、お客様がお店に入ったらすぐに元気よく。"}, {"c": 1, "t": "レジでのあいさつは[[キャッシャー]]が、明るく、ていねいに。"}, {"c": 1, "t": "お見送りのあいさつは[[バリスタ]]が、お客様の[[背中]]に向かって元気よく。"}, {"c": 1, "t": "「よろしかったですか？」は誤り。正しくは「[[よろしいですか]]？」（過去形にするのは間違い）。"}, {"c": 1, "t": "「1万円から、お預かりいたします」は誤り。正しくは「1万円、[[お預かりいたします]]」。"}, {"c": 1, "t": "「ドリンクのほうは」の「ほう」は、①[[方角]]を示す ②[[二者のどちらか]]を示す言葉なので使わない。"}, {"c": 1, "t": "「カフェラテになります」は誤り。正しくは「カフェラテ[[です（ございます）]]」。「なります」は[[状態が変わる]]ことを言う。"}, {"c": 1, "t": "お釣りがない時は「ちょうど[[頂戴いたします]]」。「お預かり」は[[お釣りがある]]ときに使う。"}, {"c": 1, "t": "「お豆はお挽きしますか？」は誤り。「お」の過剰使用で、[[商品]]には使用しない。"}, {"c": 1, "t": "お客様から失った信用を取り戻すための対応を[[カスタマーリカバリー]]という。"}, {"c": 1, "t": "カスタマーリカバリーの基本姿勢は、①真摯な態度で「[[お詫びする]]」②お客様の立場になり「[[共感する]]」③できることを「[[提案する]]」④教えていただいたことに「[[感謝する]]」。"}, {"c": 1, "t": "「提案」できることが無い時は、[[社員]]に判断を仰ぐ。不在の場合は、[[責任者]]より連絡する旨を伝え、お名前と連絡先を伺う。"}, {"c": 1, "t": "ポジションの略号：F＝[[フロア]]、C＝[[キャッシャー]]、CF＝[[キャッシャーフォロー]]、B＝[[バリスタ]]、BF＝[[バリスタフォロー]]、K＝[[キッチン]]。"}, {"c": 1, "t": "[[フロア]]は、客席を清潔に保ち、室温・BGMの管理、お客様のご案内を行う。"}, {"c": 1, "t": "[[キャッシャー]]は、オーダーを伺い、POSレジ操作、代金の受け取り、レジ提供品の提供を行う。"}, {"c": 1, "t": "[[キャッシャーフォロー]]は、レジ提供商品の準備、COD抽出の管理、補充・陳列、2台目レジの対応を行う。"}, {"c": 1, "t": "[[バリスタ]]は、ドリンクの作成・提供、お待ちのお客様へのアナウンスを行う。"}, {"c": 1, "t": "[[バリスタフォロー]]は、フードの焼成、ブレンダー（スワークル等）の作成、バリスタのサポートを行う。"}, {"c": 1, "t": "[[キッチン]]は、パスタ・リゾットの作成、冷蔵庫・冷凍庫の管理、食器類の洗浄を行う。"}, {"c": 1, "t": "キャッシャーが提供するレジ提供品には、[[COD]]、アイスコーヒー、サンドイッチなどがある。"}, {"c": 1, "t": "ドレスコード3つのポイントは、[[清潔感]]があり不快感を与えない、[[衛生的]]で安心・安全が確保できる、[[異物混入]]などが発生しない。満たさない場合は[[シフトイン]]できない。"}, {"c": 1, "t": "前髪・横髪は目や頬にかからないように[[ピン]]で留める。顔を手で触る原因となり不衛生なため。"}, {"c": 1, "t": "髪は[[肩]]にかからないようにし、長い場合は[[アップ]]にしてひとまとめにする。"}, {"c": 1, "t": "社員フェローの髪色はブラウン系で『[[5]]』程度の明るさまで。アルバイトフェローは[[ブラウン系]]であれば明るさを問わない。"}, {"c": 1, "t": "トップスの長袖は[[肘]]あたりまでまくる。"}, {"c": 1, "t": "ボトムスは、ズボンは[[長ズボン]]、スカートは[[膝丈]]。"}, {"c": 1, "t": "ボトムスでは[[皮革]]素材、ジャージ・スウェット素材、スポーツウェア、ジョガーパンツなどは禁止。"}, {"c": 1, "t": "スカート着用時は、落ち着いた色の[[タイツ・ストッキング]]を着用する。"}, {"c": 1, "t": "靴は[[安全]]で[[滑りにくい]]もの。"}, {"c": 1, "t": "エプロンのロゴマークは[[胸]]の高さに調整し、腰の紐は[[前結び]]推奨。"}, {"c": 1, "t": "エプロンは[[週に一度]]は洗濯し、アイロンをかける。エプロンは[[店舗備品]]で、退職時は返却する。"}, {"c": 1, "t": "[[コーヒーアドバイザーバッジ]]は廃止となったので使用できない。"}, {"c": 1, "t": "新ネームプレートは[[クリップ]]で[[左上]]に挟む。"}, {"c": 1, "t": "ペン類は[[1本]]まで（[[シャーペン]]は禁止）。"}, {"c": 1, "t": "爪は短く清潔に保つ（[[1mm]]以内）。付け爪、マニキュアは不可。"}, {"c": 1, "t": "アクセサリー類は[[異物混入]]の可能性があるため全て不可。"}, {"c": 1, "t": "匂いの強い化粧品や整髪料、[[柔軟剤]]、髭、[[つけまつ毛]]は不可。スマホの持ち込みも不可。"}, {"c": 1, "t": "マタニティ・ドレスコードでは、[[ジャンパースカート]]や[[ストレッチ]]素材の衣服の着用が可能。"}, {"c": 1, "t": "ドレスコード改定により、[[デニム]]生地は着用可、ベルトは指定無しとなった。"}, {"c": 1, "t": "バリスタコンテストの主な審査内容は、[[バリスタオペレーション]]と[[接客応対]]。"}, {"c": 1, "t": "バリスタコンテストは全国の[[店舗フェロー]]（アルバイト、社員）が対象。"}, {"c": 1, "t": "バリスタコンテストの目的は、タリーズブランドにおける[[バリスタの重要性]]の確認と発信、[[経営理念]]の体現。"}, {"c": 1, "t": "バリスタコンテストの流れは、[[店舗予選]] → [[ディストリクト予選]] → [[地区大会]] → [[全国大会]]。"}, {"c": 1, "t": "店舗予選では各店舗から[[アルバイトフェロー]]の代表を[[1]]名選出する。"}, {"c": 1, "t": "バリスタの育成が[[QHC]]向上の最大のポイントであり、社内外の[[ファン作り]]につながる。"}, {"c": 2, "t": "コーヒーは西暦[[600]]年頃、[[エチオピア]]で最初に発見されたとされる。"}, {"c": 2, "t": "コーヒー発見の伝説は“[[カルディ]]と踊る[[ヤギ]]たち”。カルディは[[修道僧]]。"}, {"c": 2, "t": "コーヒーは最初、チェリーを煮詰めて[[スープ]]のような形で飲まれ、[[薬]]のような物として扱われていた。"}, {"c": 2, "t": "コーヒーは一次産品の取引額で[[石油]]に次いで第二位、[[水]]の次に世界で最も飲まれている飲み物と言われる。"}, {"c": 2, "t": "コーヒーベルトとは、赤道を中心に[[北回帰線]]と[[南回帰線]]に挟まれた地域。"}, {"c": 2, "t": "コーヒーベルトは平均気温[[20]]℃以上、年間降雨量[[1500〜2000]]mm。"}, {"c": 2, "t": "コーヒーベルトには約[[60]]カ国のコーヒー生産国が集まる。"}, {"c": 2, "t": "回帰線は北緯・南緯[[25]]度と表記されることも多い（正確には23度26分22秒）。"}, {"c": 2, "t": "日本にも[[沖縄]]や[[小笠原諸島]]などにわずかにコーヒー農園がある。"}, {"c": 2, "t": "コーヒーは[[寒さ]]にとても弱く、[[霜]]が降りると枯れてしまうため、基本的に「暑い国の[[高地]]」で栽培される。"}, {"c": 2, "t": "暑い国の標高の高いところは「[[常春]]」と呼べるような気候になっている。"}, {"c": 2, "t": "コーヒーの栽培に適した標高は、赤道に[[近い]]ほど高く、赤道から離れれば下がっていく。"}, {"c": 2, "t": "標高が高いと、昼夜の[[寒暖差]]が大きく実がゆっくり熟し、熟度が高く甘い果実になりやすい。"}, {"c": 2, "t": "高地は気温も湿度も低めなため、[[虫や病気]]が発生しにくい。"}, {"c": 2, "t": "コーヒーの栽培にちょうど良い平均気温は[[20℃前半]]くらい。"}, {"c": 2, "t": "コーヒーは[[アカネ]]科コーヒーノキ属の植物。"}, {"c": 2, "t": "コーヒー豆は、[[コーヒーチェリー]]と呼ばれる赤い果実の中の[[種子]]。穀物の「豆」ではない。"}, {"c": 2, "t": "コーヒーの3つの品種は、[[アラビカ]]種、[[ロブスタ]]種、[[リベリカ]]種。"}, {"c": 2, "t": "アラビカ種の原産地は[[エチオピア]]で、世界の生産量の[[55]]%程度を占める。"}, {"c": 2, "t": "アラビカ種はとても[[デリケート]]で、病気、霜、乾燥や強すぎる日差し等に弱い。"}, {"c": 2, "t": "スペシャルティコーヒーは[[100]]%[[アラビカ]]種の中から選ばれる。"}, {"c": 2, "t": "アラビカ種の品種には[[ティピカ]]種、[[ブルボン]]種、カトゥーラ種などがあり、ティピカとブルボンは特に古い。"}, {"c": 2, "t": "アラビカとロブスタの両方の特性を持つものを[[ハイブリッド]]種という。"}, {"c": 2, "t": "ロブスタ種の原産地は[[コンゴ]]で、世界の生産量の[[45]]%程度を占める。"}, {"c": 2, "t": "ロブスタ種は[[焦げた麦]]のような独特の香りと強い[[苦味]]が特徴。"}, {"c": 2, "t": "ロブスタ種は[[インスタント]]や缶コーヒー、業務用ブレンドなどの原材料として使われることが多い。"}, {"c": 2, "t": "ロブスタ種は正式には「[[カネフォラ]]種ロブスタ」という。"}, {"c": 2, "t": "ロブスタ種のメジャーな産地は[[ベトナム]]、ブラジル、インドネシアなど。"}, {"c": 2, "t": "カフェイン含有量は、ロブスタが[[2〜3]]%、アラビカが[[1〜2]]%。"}, {"c": 2, "t": "ロブスタ種は病気や環境への[[耐性]]に優れ、アラビカより[[収穫量]]が多く生産性に優れる。"}, {"c": 2, "t": "リベリカ種の原産地は[[リベリア]]。病気（特に[[サビ病]]）に弱い。"}, {"c": 2, "t": "リベリカ種は現在、[[西アフリカ]]の一部で国内消費される程度で、市場には出回っていない。"}, {"c": 2, "t": "種をまいて[[30]]日程度で発芽し、[[半年]]ほどかけて苗木を育てる。苗木は[[日陰]]で育てる。"}, {"c": 2, "t": "苗木を農園に植えてから、収穫ができる樹になるまで[[2〜3]]年くらいかかる。"}, {"c": 2, "t": "[[雨季]]に入ってまとまった雨が降ると、花が咲き始める。"}, {"c": 2, "t": "コーヒーの花は[[白]]い色で、[[ジャスミン]]のような甘い香り。"}, {"c": 2, "t": "花が散った後は、[[半年]]以上かけてゆっくりとチェリーが育つ。"}, {"c": 2, "t": "[[乾季]]は、チェリーが赤く熟していく期間、そして収穫・精製の期間。"}, {"c": 2, "t": "収穫は[[手摘み]]がほとんどだが、[[ブラジル]]など機械を使う地域もある。"}, {"c": 2, "t": "美味しいコーヒーになるには、いかに[[完熟チェリー]]のみが集められているかがポイント。"}, {"c": 2, "t": "コーヒーチェリーの中には[[2]]粒の種子が向かい合って入っている。"}, {"c": 2, "t": "種子を包む[[パーチメント]]や[[シルバースキン]]を取り除いて乾燥させたものが「[[生豆]]（なままめ）」。"}, {"c": 3, "t": "チェリーから種子を取り出して「コーヒー豆」の状態にすることを[[精製]]と呼ぶ。"}, {"c": 3, "t": "精製の3つのパターンは、[[ナチュラル]]（乾燥式）、[[ウォッシュド]]（水洗式）、[[パルプドナチュラル]]（半水洗式）。"}, {"c": 3, "t": "ナチュラルは、[[チェリーのまま]]乾燥させた後、[[脱穀]]して生豆を取り出す。"}, {"c": 3, "t": "ナチュラルの仕上がりは、[[甘味]]や[[コク]]が強く感じられる印象になりやすい。"}, {"c": 3, "t": "ナチュラルは[[未熟]]なチェリーや不純物が混ざりやすく、[[天候]]に左右されることも多い。"}, {"c": 3, "t": "ナチュラルの生豆は、きれいな緑色ではなく[[うすめの緑色]]になることが多い。"}, {"c": 3, "t": "ナチュラルはエチオピア、[[イエメン]]、ブラジルなど、[[水]]が豊富でない土地で使われてきた。"}, {"c": 3, "t": "コンクリートなどでできた乾燥場を[[パティオ]]と呼ぶ。"}, {"c": 3, "t": "ナチュラルの乾燥は仕上がりまで[[2週間]]程度。乾燥したチェリーは[[黒く]]カラカラになる。"}, {"c": 3, "t": "網棚で乾燥させる方法を[[アフリカンベッド]]と呼び、風通しが良く[[均一]]に乾燥させやすい。"}, {"c": 3, "t": "ウォッシュドは、果肉を取り除いてから[[パーチメント]]の状態で乾燥させ、最後に脱穀する。"}, {"c": 3, "t": "ウォッシュドの仕上がりは、[[雑味]]が少なく[[クリア]]ですっきりとした印象。"}, {"c": 3, "t": "ウォッシュドの生豆は[[きれいな緑色]]に仕上がりやすい。"}, {"c": 3, "t": "チェリーの皮を取り除く機械を[[パルパー]]という。"}, {"c": 3, "t": "ウォッシュドの発酵時間は[[24〜48]]時間程度。"}, {"c": 3, "t": "パーチメントを覆う果肉分を「ぬめり」や「[[ミューシレージ]]」と呼ぶ。"}, {"c": 3, "t": "発酵の過程があるウォッシュドを「[[フーリーウォッシュド]]」と呼ぶことがある。"}, {"c": 3, "t": "焙煎豆のセンターカットに[[シルバースキン]]が多く残っているのはウォッシュド。"}, {"c": 3, "t": "パルプドナチュラルは、果肉が[[残っている]]状態のパーチメントを乾燥させる。"}, {"c": 3, "t": "パルプドナチュラルは、[[甘味]]や[[コク]]の豊かなコーヒーに仕上がりやすい。"}, {"c": 3, "t": "コスタリカではパルプドナチュラルを「[[ハニープロセス]]」と呼ぶ。"}, {"c": 3, "t": "格付けの基準は多くが「[[豆の大きさ]]」「[[標高]]」「[[欠点数]]」で、世界統一の基準は[[ない]]。"}, {"c": 3, "t": "タリーズはグレードにとらわれず、あくまでも[[テイスティング]]の評価で商品の採用を決めている。"}, {"c": 3, "t": "コロンビアの「[[スプレモ]]」は、スクリーン17以上の粒が80%以上。"}, {"c": 3, "t": "スクリーンの数値が[[大きい]]ほど粒が大きい（スクリーン1＝[[64]]分の1インチ）。"}, {"c": 3, "t": "タンザニアの「AA」は「[[ダブルエー]]」と読み、スクリーン[[6.75]]mm以上。"}, {"c": 3, "t": "グァテマラは生産地の[[標高]]で格付けし、最高のSHB（[[ストリクトハードビーン]]）は標高[[1350]]m以上。"}, {"c": 3, "t": "ブラジルは300g中の[[欠点数]]でNo.2〜8に分類し、最高ランクは「[[No.2]]」。"}, {"c": 3, "t": "エチオピアのG1は、欠点豆が300g中[[0〜3]]個。"}, {"c": 3, "t": "欠点豆のうち、チェリーが地面に落下して腐ったものを[[黒豆]]、脱穀されていない乾燥したチェリーを[[コッコ]]という。"}, {"c": 3, "t": "[[フェアトレード]]は1960年代にヨーロッパで始まり、途上国の生産者と適正な価格で継続的に取引する。"}, {"c": 3, "t": "[[レインフォレストアライアンス]]は、熱帯雨林の維持を目的に設立された非営利団体。"}, {"c": 3, "t": "[[日陰栽培]]（シェードグロウン）は、強い日差しに弱いアラビカの樹を守り、森林保全にも貢献する。"}, {"c": 4, "t": "焙煎とは、生豆を加熱することにより組織を[[膨張]]させ、化学変化にともなう[[香味成分]]を引き出す作業。"}, {"c": 4, "t": "タリーズコーヒーでは「[[フルシティロースト]]」を基本としている。"}, {"c": 4, "t": "ローストレベルは浅煎りから、ライト→[[シナモン]]→ミディアム→[[ハイ]]→シティ→[[フルシティ]]→フレンチ→[[イタリアン]]。"}, {"c": 4, "t": "酸味の元になる成分は加熱初期だけ増え、すぐ[[減少]]していくので、[[浅煎り]]のほうが酸味が強い。"}, {"c": 4, "t": "焙煎が進むと[[苦味]]と[[ボディ]]が増していく。"}, {"c": 4, "t": "焙煎が進むと水分が抜け、出来上がりの豆は[[15〜20]]%ほど軽くなる。"}, {"c": 4, "t": "生豆には[[12〜13]]%ほどの油脂分がある。"}, {"c": 4, "t": "[[フルシティ]]ローストより深煎りになると、焙煎直後にオイルが染み出てくる。"}, {"c": 4, "t": "焙煎段階でコーヒー豆が瞬間的に膨らむことを「[[ハゼ]]」という。1ハゼは[[パチパチ]]、2ハゼは[[ピチピチ]]。"}, {"c": 4, "t": "1ハゼが起こるのは[[シナモン]]、2ハゼが始まるのは[[シティ]]。"}, {"c": 4, "t": "[[シティ]]ローストあたりから焙煎段階の進みが加速する。"}, {"c": 4, "t": "焙煎の段階を精密に把握するには「[[L値]]」を使い、黒が[[0]]、白が[[100]]。"}, {"c": 4, "t": "[[直火]]式は火が直接豆に触れ、風味と甘味に優れるが焼きムラが起こりやすい。"}, {"c": 4, "t": "[[熱風]]式はムラなく安定するが、香りが飛びやすい。"}, {"c": 4, "t": "[[半熱風]]式は焼きムラが起きにくく、短時間焙煎も可能な万能型。"}, {"c": 4, "t": "生豆の状態でブレンドしてから焙煎する方法を[[プレミックス]]という。"}, {"c": 4, "t": "豆ごとに焙煎した後でブレンドする方法を[[アフターミックス]]という。"}, {"c": 5, "t": "生産エリアと味わいの傾向は、中南米＝[[バランスが良い、飲みやすい]]、アジア・オセアニア＝[[深いコク]]、アフリカ＝[[華やか、フルーティ]]。"}, {"c": 5, "t": "世界第1位の生産量を誇るのは[[ブラジル]]。"}, {"c": 5, "t": "ブラジルのコーヒーは安定した供給量と合わせやすさから[[ブレンド]]によく使われ、精製方法は[[ナチュラル]]が多い。"}, {"c": 5, "t": "ブラジルは控えめな酸味と程よいボディや[[香ばしさ]]が特徴。"}, {"c": 5, "t": "[[グァテマラ]]は豊かな降雨量と肥沃な[[火山]]土壌で、極めて優れたコーヒーを生産する国として有名。"}, {"c": 5, "t": "[[コロンビア]]は水洗式アラビカ種の生産量が世界一。"}, {"c": 5, "t": "コロンビアは、はっきりとした[[酸味]]とクリアで豊かな香りが特徴。"}, {"c": 5, "t": "[[コスタリカ]]は5ヘクタール未満の小規模農園が多く、明るく爽やかな酸味とクリアな味わい。"}, {"c": 5, "t": "「[[ブルーマウンテン]]」は[[ジャマイカ]]の標高2,256mの特定エリアで栽培される。"}, {"c": 5, "t": "インドネシアの「[[マンデリン]]」は深いボディが特徴で、[[スマトラ]]島北部で栽培される。"}, {"c": 5, "t": "インドネシアのスラウェシ島のコーヒーは「[[トラジャ]]」という銘柄で知られる。"}, {"c": 5, "t": "インドネシアは[[9]]割くらいがロブスタ種の生産。"}, {"c": 5, "t": "[[パプアニューギニア]]のコーヒー生産は、1930年代にブルーマウンテンから樹が移植されたのが始まり。"}, {"c": 5, "t": "パプアニューギニアでは原種の[[ティピカ]]種が今なお多く栽培されている。"}, {"c": 5, "t": "ロブスタの生産世界1位は[[ベトナム]]（約95%がロブスタ）。"}, {"c": 5, "t": "アフリカのコーヒーは、[[フルーティ]]、[[フローラル]]、スパイシーな華やかなアロマ・フレーバーを持つものが多い。"}, {"c": 5, "t": "「モカ」の名は、もともと[[イエメン]]の[[モカ港]]から輸出されていたことに由来する。"}, {"c": 5, "t": "現在、日本で流通している「モカ」の多くは[[エチオピア]]産。"}, {"c": 5, "t": "エチオピアの栽培地方は、[[シダモ]]、[[イルガチェフェ]]、ハラー、ジンマなどが有名。"}, {"c": 5, "t": "エチオピアの伝統慣習「[[コーヒーセレモニー]]」では、各家庭のお嫁さんが焙煎から抽出までを行う。"}, {"c": 5, "t": "「キリマンジャロ」は[[タンザニア]]産で、アフリカ最高峰キリマンジャロ（[[5,895]]m）の裾野で作られる。"}, {"c": 5, "t": "[[ケニア]]は個性的な酸味からくるフルーティ感と甘く華やかなアロマが特徴。"}, {"c": 5, "t": "コーヒー消費量は、1位[[アメリカ]]、2位[[ブラジル]]、3位[[ドイツ]]、4位[[日本]]。"}, {"c": 5, "t": "コーヒー輸入量は、1位アメリカ、2位[[ドイツ]]、3位[[日本]]。"}, {"c": 5, "t": "[[北欧]]の国では、1人当たりのコーヒー消費量がとても多い。"}, {"c": 5, "t": "日本人の1人当たりのコーヒー消費量は年間約[[3.5]]kgで、1日約[[1]]杯の計算。"}, {"c": 5, "t": "日本のコーヒー生豆の国別輸入量は[[ブラジル]]が最も多い。"}, {"c": 6, "t": "スペシャルティコーヒーとは、香りや味わいが際立って印象的で、[[個性]]がはっきりと感じられる“おいしい”コーヒー。"}, {"c": 6, "t": "スペシャルティコーヒーは、グレードや農園のブランドではなく、あくまでも[[味わいの評価]]が重要。"}, {"c": 6, "t": "スペシャルティコーヒーと呼べるものは、[[アラビカ]]種の中から生まれる。"}, {"c": 6, "t": "一般品を「[[コモディティ]]」と呼ぶことがある。"}, {"c": 6, "t": "スペシャルティコーヒーという言葉は、ひと昔前の[[アメリカ]]で、「質より量」に対し品質や個性を大切にする考えから生まれた。"}, {"c": 6, "t": "「[[From Seed to Cup]]」（種子からカップまで）：たくさんの人の情熱があって初めてスペシャルティコーヒーが完成する。"}, {"c": 6, "t": "タリーズのコーヒー豆は、タリーズの[[テイスター]]（評価者）が直接味わいの評価をして決めている。"}, {"c": 6, "t": "タリーズはブラジルの[[ファゼンダバウ]]（バウ農園）とパートナーシップを結んでいる。"}, {"c": 6, "t": "ポルトガル語で、ファゼンダ＝「[[農園]]」、バウ＝「[[宝箱]]」。"}, {"c": 6, "t": "ファゼンダバウの農園主は[[フクダトミオ]]氏で、現在は2代目フクダタケオ氏が運営。"}, {"c": 6, "t": "ファゼンダバウのエリアは[[セラード]]・パットスデミナス、標高は[[1100]]m前後。"}, {"c": 6, "t": "2007年1月、ファゼンダバウのタリーズ専用区画（約65ha）に[[ブルボン]]種を苗から植えた。"}, {"c": 6, "t": "2009年4月、初の商品「ブラジルファゼンダバウ [[ファーストクロップ]]」が発売された。"}, {"c": 6, "t": "ファゼンダバウでアフリカンベッドを使ったナチュラルは「[[ドライオンベッド]]」という商品名で発売。"}, {"c": 6, "t": "タリーズは[[グァテマラ]]で2008年より毎年「[[カッピングコンテスト]]」を開催している。"}, {"c": 6, "t": "カッピングコンテストで「[[金賞]]」を受賞した農協のコーヒー豆は、農協ごとにパッケージ・商品化される。"}, {"c": 6, "t": "コンテストの目的は、小規模農協の優れた豆の[[発掘]]、品質の良い栽培への[[モチベーション]]向上、生産者の[[生活向上]]への貢献。"}, {"c": 6, "t": "カッピングとは、[[粗挽き]]の粉をカップに入れ、直接お湯を注いで抽出し、[[スプーン]]ですくってテイスティングする手法。"}, {"c": 6, "t": "農協単位ではなく、区画や農園単位で細かく管理・生産された豆を「[[マイクロロット]]」と呼ぶ。"}, {"c": 6, "t": "コスタリカマイクロロットプロジェクトは、[[タラス]]地区の[[ドータ]]農協の協力のもと行っている。"}, {"c": 6, "t": "高品質コーヒーの確保が難しくなる要因は、新興国などの[[需要拡大]]と、[[温暖化]]による産地の環境変化。"}, {"c": 6, "t": "接ぎ木の水平展開は、品質は良いがデリケートな[[ティピカ]]種と、病虫害に強い[[リベリカ]]種の組み合わせ。ハワイコナの好事例を展開。"}, {"c": 6, "t": "接ぎ木の水平展開は、[[ペルー]]、[[パプアニューギニア]]、[[ラオス]]で取り組んでいる。"}, {"c": 6, "t": "マンデリンの開発テストは[[ラオス]]で行っている。"}, {"c": 6, "t": "乾燥の途中で脱穀し、生豆の状態で仕上げ乾燥を行う方法を「[[スマトラ式]]」という。"}, {"c": 6, "t": "ブレンド用コスタリカでは、紫色に熟した[[グレープチェリー]]での収穫や、[[天日乾燥]]を指定している。"}, {"c": 6, "t": "デカフェ処理の課題は、①コーヒー本来の[[特徴]]が失われる ②処理後の生豆が[[劣化]]しやすい。"}, {"c": 6, "t": "カフェインを取り除く液体は、[[水]]・[[超臨界炭素ガス]]・[[有機溶媒]]（日本では禁止）の3種類。"}, {"c": 6, "t": "タリーズのデカフェは[[メキシコ]]の工場で行われる「[[マウンテンウォーター]]デカフェ」。"}, {"c": 6, "t": "マウンテンウォーター製法は「[[浸透圧]]」の原理を利用し、水中にない[[カフェイン]]だけを溶け出させる。"}, {"c": 7, "t": "最高のドリップコーヒーのための7ステップ：①[[フレッシュ]]な豆 ②[[清潔]]な道具 ③[[浄水]] ④正しい[[温度]] ⑤正しい[[分量]] ⑥正しい[[グラインディング]] ⑦適切な[[抽出時間]]。"}, {"c": 7, "t": "コーヒーは豆を[[挽いた]]瞬間から、劣化が一気に加速する。抽出する[[直前]]に挽くのがベスト。"}, {"c": 7, "t": "道具が汚れていると、古い[[油]]や[[出涸らし]]が蓄積し、悪くなった味が一緒に抽出される。"}, {"c": 7, "t": "[[浄水フィルター]]は定期的に交換する。"}, {"c": 7, "t": "タリーズでのコーヒー抽出の基本は[[90]]℃。"}, {"c": 7, "t": "出来上がりのコーヒーの[[99]]%以上は水分。"}, {"c": 7, "t": "ミネラルウォーターの場合は[[軟水]]を使うのが基本。"}, {"c": 7, "t": "日本では水1Lあたりのミネラル含有量が[[100]]mg以下のものを軟水という。"}, {"c": 7, "t": "[[硬水]]で淹れると、コーヒーが重たく感じられやすい（場合により苦味もアップ）。"}, {"c": 7, "t": "温度が[[高い]]と濃いめで苦みや雑味多め、[[低い]]とあっさりで酸味やや多めになる。"}, {"c": 7, "t": "メッシュが細かいほど、①[[表面積]]が大きくなる ②お湯の浸透に[[時間]]がかかるため、成分が多く溶け出す。"}, {"c": 7, "t": "挽き方は基本的には[[器具]]に合わせる。"}, {"c": 7, "t": "フレンチプレスに細かい粉を使うと、[[粉っぽく]]なったり雑味が出る。"}, {"c": 7, "t": "エスプレッソマシンにドリップ用の粉を使うと[[薄く]]なる。"}, {"c": 7, "t": "「濃いめがいいけど苦いのは嫌」なら、基本より[[粗め]]に挽き、[[分量]]を増やしてドリップする。"}, {"c": 7, "t": "分量の目安は[[150]]cc（1杯分）に対して[[10]]g程度。"}, {"c": 7, "t": "抽出量が少ない時ほど、粉を[[多め]]にする（150ccなら15gなど）。"}, {"c": 7, "t": "600cc抽出の場合、40gだと濃いめなので[[35]]g程度が適当。"}, {"c": 7, "t": "抽出時間とは、コーヒー粉と[[お湯]]を触れさせている時間。長いほど[[濃く]]なり、苦味も増す。"}, {"c": 7, "t": "ドリップ抽出では、主に[[メッシュ]]とお湯を注ぐ[[スピード]]が抽出時間を左右する。"}, {"c": 7, "t": "エスプレッソの抽出時間は[[20〜25]]秒。粉の量、メッシュ、適切な[[タンピング]]で調整する。"}, {"c": 7, "t": "ハンドドリップの抽出時間の目安は、蒸らしの後[[3〜4]]分ほど。"}, {"c": 7, "t": "苦味の成分には、[[カフェイン]]、[[トリゴネリン]]、カラメル、褐色色素などがある。"}, {"c": 7, "t": "「良い苦味」は水に[[溶けやすい]]成分、「嫌な苦味」は水に[[溶けにくい]]成分。"}, {"c": 7, "t": "「嫌な苦味」をおさえるには、温度を[[上げすぎない]]、[[混ぜすぎない]]、湯量・時間を[[オーバーしない]]、メッシュを[[細かくしすぎない]]。"}, {"c": 7, "t": "「アメリカン」を作るなら、適量で抽出したコーヒーを後から[[お湯で割る]]ほうがすっきり仕上がる。"}, {"c": 7, "t": "カフェインの効果として、眠気覚まし、[[脂肪燃焼]]促進、肝臓・腎臓のはたらきの活発化（[[利尿]]作用）、[[消化]]促進がある。"}, {"c": 7, "t": "コーヒーポリフェノールと呼ばれる「[[クロロゲン酸]]」は、抗酸化作用がある。"}, {"c": 7, "t": "コーヒーの[[タンニン]]は鉄分と結合しやすいので、貧血気味の人は食後[[60]]分程度空けて飲むと良い。"}, {"c": 7, "t": "コーヒーの香りを「いい香り」と感じている時は、脳から[[アルファ波]]が出ているとされる。"}, {"c": 8, "t": "コーヒー豆の鮮度を守るために、①納品後[[すぐに]]使用（販売） ②[[挽きたて]]を使用 ③[[淹れたて]]をお出しする。"}, {"c": 8, "t": "抽出後[[1]]時間経過したコーヒーはお出しできない。"}, {"c": 8, "t": "コーヒー豆の管理・4つのルールは、①[[フレッシュローテーション]]ルール ②[[都度挽き]]ルール ③[[CDDA]]ルール ④[[3-7-10]]ルール。"}, {"c": 8, "t": "フレッシュローテーションルール：常に在庫を[[回転]]させ、古いコーヒー豆が店舗で[[滞留]]しないように管理する。"}, {"c": 8, "t": "フレッシュローテーションのために、積極的な豆の[[販売]]、[[COD]]での使用、適切な[[発注・在庫管理]]を行う。"}, {"c": 8, "t": "都度挽きルール：本日のコーヒーは[[挽きたて]]を使用し、[[事前に挽いて]]置くことは禁止。"}, {"c": 8, "t": "COD用の豆は、[[豆のまま]]で小分けして保管し、抽出の直前に挽く。"}, {"c": 8, "t": "VMD棚でのビーンズ陳列も「[[先入れ先出し]]」。"}, {"c": 8, "t": "シーズナルビーンズは、遅くとも[[次のシーズナルビーンズ]]が導入される前には終わっている状態を目指す。"}, {"c": 8, "t": "CDDA：C＝[[COOL]]（涼しい）、D＝[[DRY]]（乾燥した）、D＝[[DARK]]（暗い）、A＝[[AIRTIGHT]]（密閉した）。"}, {"c": 8, "t": "[[エスプレッソマシン]]の周りなど暑くなる場所に保管しない（COOL）。"}, {"c": 8, "t": "[[シンク]]周りなど湿気の多い場所に保管しない（DRY）。"}, {"c": 8, "t": "カウンターなどに出しっぱなしにせず[[戸棚]]に保管する（DARK）。"}, {"c": 8, "t": "タッパーなど、[[密閉]]できる容器で保管する（AIRTIGHT）。"}, {"c": 8, "t": "劣化の原因となるものは、[[温度]]、[[湿気]]、[[光]]、[[酸素]]。"}, {"c": 8, "t": "3-7-10ルール「3」：挽いた豆をCODで使用できるのは、挽いた日を含め[[3]]日まで。"}, {"c": 8, "t": "3-7-10ルール「7」：開封した豆を[[販売]]できるのは、開封日を含め[[7]]日まで。"}, {"c": 8, "t": "3-7-10ルール「10」：開封した豆をCODで使用できるのは、開封日を含め[[10]]日まで。"}, {"c": 8, "t": "3-7-10は[[最低限]]のルール。CODでは「[[都度挽き]]」を優先し、量り売りは基本的に新しいものを開封する。"}, {"c": 8, "t": "コーヒーの劣化で起こるのは、①[[香り]]の損失 ②[[オイル]]の酸化。"}, {"c": 8, "t": "焙煎した豆は[[炭]]に似た構造で、周囲のにおいを取り込む力があるため、でがらしは[[脱臭剤]]として再利用できる。"}, {"c": 8, "t": "家庭での保存期間の目安は、挽いた豆は[[1週間]]程度、豆のままでは[[2週間]]程度。"}, {"c": 8, "t": "冷蔵庫や冷凍庫は、室温との温度差により[[結露]]が発生する恐れがある。"}, {"c": 8, "t": "毎日使うコーヒーは密閉して[[常温]]で、戸棚の中などに保管して早めに使う。"}, {"c": 8, "t": "長期保存の場合は[[冷凍]]保存が効果的で、数ヶ月〜[[半年]]くらいは良い鮮度で保てる。"}, {"c": 8, "t": "冷凍した豆を使う時は、[[常温に戻して]]から開封する。"}, {"c": 8, "t": "美味しさを長く保つには、[[豆のまま]]の保管のほうが良い。"}, {"c": 9, "t": "ペーパーフィルターは、余分な[[オイル]]や細かい粉を[[ろ過]]するので、クリアな味に仕上がりやすい。"}, {"c": 9, "t": "ペーパーフィルター（ハンドドリップ）の挽き方は[[中挽き]]程度（D6.5〜7.0）。"}, {"c": 9, "t": "ペーパーフィルターのとじしろは、側面と底面をそれぞれ[[逆]]のほうへ折り曲げる。"}, {"c": 9, "t": "蒸らしは、中心から外側へ[[渦]]を描くように細くゆっくりとお湯をかけ、[[30〜60]]秒ほど置く。"}, {"c": 9, "t": "蒸らし後は、中心に「[[の]]」の字や円を描くように、[[4〜5]]回くらいに分けて水面を上げる。"}, {"c": 9, "t": "周りの粉を崩さないように中央だけに注ぎ、コーヒー粉の[[土手]]をキープする。"}, {"c": 9, "t": "土手が崩れて2層になると、お湯が粉の層を通らずに出ていき、[[薄く]]なってしまう。"}, {"c": 9, "t": "水面の[[泡]]を落とさないために、お湯が残ったままでドリッパーを外す。"}, {"c": 9, "t": "数杯分を作ったときは、最後に[[くるくるかき回す]]。下のほうが[[濃いめ]]にかたよるため。"}, {"c": 9, "t": "コーヒーアドバイザーの取得には、[[ハンドドリップ]]と[[フレンチプレス]]の実演ができる必要がある。"}, {"c": 9, "t": "3つ穴を[[カリタ]]式、1つ穴を[[メリタ]]式とも呼ぶ（どちらもメーカーの名前）。"}, {"c": 9, "t": "1つ穴ドリッパーは抽出時間が長くなり苦くなることがあるので、やや[[粗め]]の粉を使うとバランスが取れる。"}, {"c": 9, "t": "タリーズオリジナルドリッパーは[[2]]つ穴で、「[[誰でも美味しく]]」をコンセプトにしている。"}, {"c": 9, "t": "オリジナルドリッパーは口径と容量がやや[[小さく]]、粉の層が[[厚く]]なるため、やや濃いめに仕上がる。"}, {"c": 9, "t": "オリジナルドリッパーで濃く感じる場合は、メッシュを[[粗め]]にしてバランスを取る。"}, {"c": 9, "t": "オリジナルドリッパーの挽き方は[[中細挽き〜中挽き]]（D6.5〜8.0）。"}, {"c": 9, "t": "オリジナルドリッパーにペーパーフィルターを使う時は、サイドを少し[[太め]]に折るとフィットする。"}, {"c": 9, "t": "V60は[[ハリオ]]社の[[円錐]]形ドリッパーで、リブがらせん状、大きな1つ穴。"}, {"c": 9, "t": "V60でお湯をゆっくり注ぐと、[[ネルドリップ]]に近いこってりとした味わいになる。"}, {"c": 9, "t": "メタルドリッパーは、適度に[[オイル]]も抽出され、まろやかで[[ボディ]]感のある仕上がり。"}, {"c": 9, "t": "タリーズメタルドリッパーの挽き方は[[中挽き]]（D8.0、G4.0）。"}, {"c": 9, "t": "メタルドリッパーの分量は、1杯[[20]]g/150cc、2杯[[30]]g/300cc、3杯[[40]]g/450cc。"}, {"c": 9, "t": "メタルドリッパーは超微細メッシュを[[2]]枚重ねた構造。"}, {"c": 9, "t": "メタルドリッパーでは、お湯は[[細め]]に丁寧に、注ぐ円は[[小さめ]]にして中心を意識する。"}, {"c": 9, "t": "メタルドリッパーとドリップマスターは、[[Bodum]]社の製品をタリーズ仕様にカスタマイズしたもの。"}, {"c": 9, "t": "フレンチプレスの挽き方は[[粗挽き]]（D9.0）で、分量は150ccにつき[[10]]g。"}, {"c": 9, "t": "フレンチプレスは蒸らし約[[30]]秒の後、お湯を注ぎ、フタをして[[4]]分待ってプレスする。"}, {"c": 9, "t": "フレンチプレスはかき混ぜすぎると[[雑味]]のもとになるので、表面だけさくっと混ぜる。"}, {"c": 9, "t": "フレンチプレスで複数のカップに注ぐ時は、お茶のように半分ずつ A→B→C→[[C→B→A]] と注ぐ。"}, {"c": 9, "t": "浸け込みタイプは粗めの粉で抽出するため、ドリップに比べて[[苦み]]は出にくく、オイルで[[甘味]]やまろやかさを感じやすい。"}, {"c": 9, "t": "ワンカップコーヒーメーカーは[[粗挽き]]（D9.0、G4.5）、分量は[[16〜20]]g程度。"}, {"c": 9, "t": "ワンカップコーヒーメーカーは、約[[200]]ccのお湯を注ぎ、フタをして[[4]]分待つ。"}, {"c": 9, "t": "タリーズドリップマスターは、[[メタルメッシュ]]フィルターを使い、ペーパーとプレスの良さを持つ。"}, {"c": 9, "t": "ドリップマスターの挽き方は[[粗挽き]]（D9.0）、分量は1回[[20]]g程度。"}, {"c": 9, "t": "ドリップマスターで鮮度の悪い粉を使うと、粉が[[膨らまず]]お湯が早く落ちて薄くなる。"}, {"c": 9, "t": "水出しコーヒーポットの挽き方は[[細挽き]]（D5.5）。"}, {"c": 9, "t": "タリーズの水出しポットの分量は、[[50]]g/600ml、[[80]]g/1000ml。"}, {"c": 9, "t": "水出しポットは冷蔵庫で[[8]]時間程度寝かせてできあがり。2日程度は美味しく飲める。"}, {"c": 9, "t": "水出しコーヒーは最初に考案したのが[[オランダ]]人のため、「[[ダッチコーヒー]]」とも呼ばれる。"}, {"c": 9, "t": "水出しはもともと、苦味の強いインドネシアの[[ロブスタ]]を飲みやすくする工夫から生まれた。"}, {"c": 9, "t": "サイフォンは[[中細挽き]]（D6.0）で、抽出温度が[[高く]]、濃く苦めの仕上がり。"}, {"c": 9, "t": "サイフォンの下の丸い部分を「[[フラスコ]]」、上の筒状の部分を「[[ロート]]」という。"}, {"c": 9, "t": "ネルドリップは[[中挽き]]（D7.0）で、[[こってり]]した仕上がりになりやすい。"}, {"c": 9, "t": "ネルフィルターは起毛になっている面を[[外側]]にする。"}, {"c": 9, "t": "布のフィルターは、[[水に浸けて冷蔵]]保管＆[[煮沸]]消毒などの管理が必要。"}, {"c": 9, "t": "モカポット（マキネッタ）は[[極細挽き]]（D3.0）で、[[エスプレッソ]]に近い濃厚な味わい。"}, {"c": 9, "t": "パーコレーターは[[粗挽き]]（D8.0〜9.0）で、抽出液を[[沸騰]]させ続けるため味は落ちる。"}, {"c": 9, "t": "トルココーヒーを淹れる器具は[[イブリック]]。"}, {"c": 9, "t": "ベトナム式フィルターでは、あらかじめ[[コンデンスミルク]]を入れたカップに抽出して飲むことが多い。"}, {"c": 9, "t": "コーヒーの抽出は、熱湯を「[[細くゆっくり]]と注ぐ」ことがおいしく淹れるコツ。"}, {"c": 9, "t": "タリーズコーヒーケトルは[[直火]]で使うと変色するので、別で沸かしたお湯を移し替えて使う。"}, {"c": 9, "t": "タリーズコーヒーミルはハンドルを[[右]]回転させて豆を挽く。"}, {"c": 9, "t": "タリーズコーヒーミルは[[セラミック]]臼とステンレスパーツで、分解＆丸洗いができる。"}, {"c": 9, "t": "ミルで細かくするには粗さ調整ナットを[[右]]回り、粗くするには[[左]]回り。"}, {"c": 10, "t": "抽出の味わいを調整するベースは、①[[温度]] ②[[分量]] ③[[メッシュ]] ④[[抽出時間]]。"}, {"c": 10, "t": "温度を[[下げる]]・粉を[[減らす]]・[[粗挽き]]にする・抽出時間を[[短く]]すると、薄くなる。"}, {"c": 10, "t": "温度を[[上げる]]・粉を[[増やす]]・[[細挽き]]にする・抽出時間を[[長く]]すると、濃くなる。"}, {"c": 10, "t": "[[酸味]]や[[甘味]]は、低温や粗挽きでも抽出されやすい。"}, {"c": 10, "t": "[[苦味]]や雑味、[[香り]]の成分は、温度を上げたり細挽きにするほど増える。"}, {"c": 10, "t": "濃すぎたり苦すぎたりすると、豆本来の[[特徴]]が分かりにくくなる。"}, {"c": 10, "t": "抽出レシピは、①豆の[[特徴]]をどう引き出すか ②飲む人の[[好み]]や飲み方にどう合わせるか、をテーマに考える。"}, {"c": 10, "t": "苦味を抑えたい（フルーティな豆）：ペーパーで、基本より[[粗め]]、温度は[[84]]℃前後。"}, {"c": 10, "t": "深みを出したい（フルボディの豆）：[[メタルドリッパー]]で、温度は[[88]]℃程度、粉量やや多め。"}, {"c": 10, "t": "深煎りをすっきりさせたい：ペーパーで、[[粗挽き]]（プレス程度）、蒸らし88℃、抽出[[82〜84]]℃。"}, {"c": 10, "t": "まろやかにしたい：[[プレス]]や[[メタル]]でオイルをプラスし、温度は84℃程度。"}, {"c": 10, "t": "おいしいカフェオレは、コーヒー：ミルク＝[[1：1]]を目安にする。"}, {"c": 10, "t": "ラテやカフェモカのイメージなら、コーヒー：ミルク＝[[3：7]]を目安に、かなり濃く抽出する。"}, {"c": 11, "t": "アイスコーヒー抽出の一番のポイントは「[[急冷]]」。"}, {"c": 11, "t": "氷の量の目安は、できあがりの[[40]]%ほど。600ml作る場合、氷は[[240]]g。"}, {"c": 11, "t": "アイスは粉を[[たっぷり]]、ホットの[[1.5]]倍程度で、しっかり濃いめに抽出する。"}, {"c": 11, "t": "アイスコーヒーコースの基本の抽出量は[[50]]g/[[600]]cc。少人数なら25g/300cc/氷120g（粉1：お湯[[12]]）。"}, {"c": 11, "t": "オリジナルドリッパーはやや小ぶりなので、粉量は最大[[50]]gが良い。"}, {"c": 11, "t": "急冷するのは、[[湯気]]と一緒に[[香り]]が逃げるのを防ぐため。"}, {"c": 11, "t": "アイスは、ホットよりさらに[[細く]]じっくり注ぎ、フィルターの縁ギリギリまで[[水位]]を上げる。"}, {"c": 11, "t": "アイスコーヒーは、淹れたては[[キリッとシャープ]]、冷蔵庫で1〜2時間寝かせると[[トロッとまろやか]]な口当たりになる。"}, {"c": 11, "t": "アイスコーヒーは冷蔵庫で[[2]]日程度美味しく飲める。におい移りを防ぐため[[ラップ]]をかける。"}, {"c": 11, "t": "コーヒーは冷やすと[[酸味]]を強く感じやすいので、アイスには一般的に[[深煎り]]のブレンドが使われる。"}, {"c": 11, "t": "タリーズのアイスコーヒーブレンドは「[[フレンチロースト]]」の次に深煎り。"}, {"c": 11, "t": "アイスカフェオレ派には、[[フレンチロースト]]、[[エスプレッソクラシコ]]などがおすすめ。"}, {"c": 11, "t": "すっきりフルーティ派には、エチオピア、[[キリマンジャロ]]、コスタリカなど「[[mild]]」の豆。"}, {"c": 11, "t": "中間派には、[[モカジャバ]]、ブラックスリー、カフェオレモナーレなど。"}, {"c": 11, "t": "沸騰直後のお湯をケトルに移した直後は[[92〜93]]℃程度。さらに[[1〜2]]分置くとちょうど良い。"}, {"c": 11, "t": "アイスコーヒーコースで復習する蒸らし時間は[[30〜40]]秒程度。"}, {"c": 11, "t": "水出しコーヒーは「[[COLD BREW]]（コールドブリュー）」という名で一般的になった。"}, {"c": 11, "t": "水出しは、低温なので[[苦味]]や雑味が抑えられ、まろやかで[[甘味]]を感じやすい。"}, {"c": 11, "t": "水出しの作り方は、点滴のように時間をかけて[[ドリップ]]するか、水に粉を直接[[漬け込んで]]から濾すか。"}, {"c": 11, "t": "アイスコーヒーコースのテーマは「[[アイスコーヒーを楽しもう]]」で、プログラムは約[[90]]分。"}, {"c": 11, "t": "アイスコーヒーコースでお客様に抽出していただくのは[[1]]回のみ。"}, {"c": 11, "t": "アイスコーヒーコースでは、[[アイスコーヒーブレンド]]と[[シーズナルビーンズ]]を飲み比べる。"}, {"c": 11, "t": "アイスコーヒーブレンドには[[ベイクドチーズケーキ]]がおすすめ。"}, {"c": 11, "t": "アレンジコーヒーは、アイス[[バニラ]]ラテ、アイスカフェ[[モカ]]、アイス[[ハニーミルク]]ラテ。"}, {"c": 11, "t": "スクールの試飲は[[店舗]]で作成する。自宅等で作ったものは提供できない。"}, {"c": 11, "t": "スクール参加当日は、ビーンズ＆グッズが[[10]]%OFF。スタンプカードは[[2]]個捺印。"}, {"c": 11, "t": "ドリッパーの粉の上に氷をのせて溶けるのを待つ「[[アイスドリップ]]」は、ウォータードリップに近い仕上がり。"}, {"c": 11, "t": "お気に入りの豆に深みを加えるなら、[[フレンチロースト]]を1〜3割程度混ぜる。"}, {"c": 12, "t": "テイスティングは、①カップに鼻を近付けて[[香り]]を吸い込む ②口に含んだら[[舌全体]]に広げる ③口に含んだまま[[鼻]]で息を出し入れする。"}, {"c": 12, "t": "香りを嗅ぐ時は、[[目をつぶる]]と嗅覚に集中しやすい。"}, {"c": 12, "t": "テイスティングワードには、[[アロマ]]、[[フレーバー]]、[[アシディティ]]、[[ボディ]]、後味・余韻などがある。"}, {"c": 12, "t": "アロマとは、[[カップから立ちのぼる]]香り。"}, {"c": 12, "t": "抽出前の挽いた状態の豆の香りは「[[フレグランス]]」と呼ぶ。"}, {"c": 12, "t": "フレーバーとは、口の中に広がる[[香り]]と[[味わい]]（風味）。"}, {"c": 12, "t": "アシディティ（酸味）は、主に舌の[[側面]]で感じやすいと言われる。"}, {"c": 12, "t": "ボディ（コク）とは、液体の[[密度]]、[[質感]]、食感。"}, {"c": 12, "t": "ボディ感の強いのが「[[濃厚なミルク]]」、弱いのが「[[水]]」に近い印象。"}, {"c": 12, "t": "コーヒー豆の味わいを3つの単語で表現したものを「[[スリーキーワード]]」という。"}, {"c": 12, "t": "ハウスブレンドのスリーキーワードは、[[Balanced]]・[[Smooth]]・[[Bright]]。"}, {"c": 12, "t": "Winy＝[[ワイン]]のような、Earthy＝[[大地]]のような、Brisk＝[[爽やか]]な。"}, {"c": 12, "t": "フードペアリングの基本セオリーは「コーヒーの[[イメージに近いもの]]と合わせる」。"}, {"c": 12, "t": "酸味があり飲みやすいコーヒーには、[[ビスケット]]、クッキー、[[サンドイッチ]]、せんべいなどが合わせやすい。"}, {"c": 12, "t": "深いボディのコーヒーには、クリームやバターたっぷりのケーキ、[[チョコレート]]、黒糖かりんとうなどが合わせやすい。"}, {"c": 12, "t": "フルーティな酸味のコーヒーには、イチゴのショートケーキ、[[フルーツタルト]]、アップルパイなどが合わせやすい。"}, {"c": 12, "t": "あっさりした料理の後には[[浅煎り]]や中南米、こってりした料理の後には[[深煎り]]や重量感のあるコーヒー。"}, {"c": 12, "t": "クセがなくコーヒーの味の邪魔になりにくいのは[[グラニュー糖]]や[[氷砂糖]]。"}, {"c": 12, "t": "グラニュー糖にカラメルを混ぜて結晶化したものを[[コーヒーシュガー]]という。"}, {"c": 12, "t": "[[ガムシロップ]]は溶けやすさでアイスコーヒーに使うのが一般的。"}, {"c": 12, "t": "[[動物性]]クリームは濃いめや深煎り、[[植物性]]クリームはマイルドや浅煎りのコーヒーとよく合う。"}, {"c": 12, "t": "コーヒーフレッシュ（ポーション）の多くは[[植物性]]クリーム。"}, {"c": 12, "t": "空腹時に胃が気になる場合は[[カフェオレ]]にすると、ミルクの脂分が胃壁をカバーする。"}, {"c": 12, "t": "ストレートに味わうカップは、内側が[[白か薄い色]]。"}, {"c": 12, "t": "マイルド・すっきり・フルーティには[[薄手]]、どっしりめやカフェオレには[[厚手]]のカップ。"}, {"c": 13, "t": "タリーズのビーンズは、[[MILD]]（すっきり、のみやすい）、[[MEDIUM]]（ほどよい深み）、[[FULL BODY]]（深いコク、のみごたえ）に分かれる。"}, {"c": 13, "t": "MILDの中で、すっきりした酸味があって一番軽やかなのは[[ピッコロバンビーノ]]。"}, {"c": 13, "t": "FULL BODYの中で、やわらかさもありブラックでも飲みやすいのは[[ブラックスリー]]と[[カフェオレモナーレ]]。"}, {"c": 13, "t": "ハウスブレンドは[[MILD]]、原産国は[[コロンビア]]、[[グァテマラ]]他。"}, {"c": 13, "t": "ハウスブレンドは「[[マイルド＆スムース]]」。程よいボディと明るい酸味、[[中南米]]産のブレンド。"}, {"c": 13, "t": "ハウスブレンドのセールスワードは「[[程よいボディとすっきり感]]」、いつでも・どんなシーンでも飽きのこない味わい。"}, {"c": 13, "t": "ピッコロバンビーノの原産国は[[グァテマラ]]、[[パプアニューギニア]]他。"}, {"c": 13, "t": "ピッコロバンビーノのスリーキーワードは、[[Mild]]・[[Caramel]]・Balanced。"}, {"c": 13, "t": "ピッコロバンビーノのセールスワードは「[[すっきり爽やか]]」、[[モーニングコーヒー]]にぴったり。"}, {"c": 13, "t": "ブラジル（バウ）は[[MEDIUM]]で、スリーキーワードは[[Nutty]]・[[Sweet]]・Balanced。"}, {"c": 13, "t": "ブラジル（バウ）は「[[濃縮された甘味]]」。ナッツや[[ピーナッツ]]のようなフレーバー。"}, {"c": 13, "t": "ブラジル（バウ）のパッケージは[[トゥッカーノ]]のイラストと[[ブラジルイエロー]]。"}, {"c": 13, "t": "ブラジルのセールスワードは「程よいコク、コーヒーの[[自然な甘み]]」、[[ハチミツ]]との相性が良い。"}, {"c": 13, "t": "モカジャバは[[MEDIUM]]、原産国は[[インドネシア]]、[[エチオピア]]。"}, {"c": 13, "t": "モカジャバのスリーキーワードは、[[Deep]]・[[Rich]]・[[Winy]]。"}, {"c": 13, "t": "モカジャバは「芳醇な香りと風味」。エチオピア・[[モカフレーバー]]の妖艶な香り、[[フルボディの赤ワイン]]を感じさせる口当たり。"}, {"c": 13, "t": "モカジャバのパッケージは、エチオピアをイメージした[[ラクダ]]が印象的。"}, {"c": 13, "t": "モカジャバのセールスワードは「まるで[[ワイン]]のような風味」、[[スイーツ]]にぴったり。"}, {"c": 13, "t": "ブラックスリーは[[FULL BODY]]、原産国は[[コロンビア]]、[[ペルー]]。"}, {"c": 13, "t": "ブラックスリーのスリーキーワードは、[[Rich]]・[[Caramel]]・Balanced。"}, {"c": 13, "t": "ブラックスリーのセールスワードは「[[ブラック派]]の方におすすめ」のリッチなコク。"}, {"c": 13, "t": "カフェオレモナーレは[[FULL BODY]]、原産国は[[グァテマラ]]、[[コロンビア]]他。"}, {"c": 13, "t": "カフェオレモナーレのスリーキーワードは、[[Floral]]・Rich・[[Sweet]]。"}, {"c": 13, "t": "カフェオレモナーレは「[[ミルクとの相性がぴったり]]」。ミルクに負けないコク、[[花]]のような華やかな香り。"}, {"c": 13, "t": "エスプレッソクラシコは[[FULL BODY]]、原産国は[[グァテマラ]]、[[コスタリカ]]他。"}, {"c": 13, "t": "エスプレッソクラシコのスリーキーワードは、[[Sweet]]・Rich・[[Nutty]]。"}, {"c": 13, "t": "エスプレッソクラシコは「リッチなボディ、甘い香り」。お店の[[カフェラテ]]などのベースで使用中。"}, {"c": 13, "t": "フレンチローストの原産国は[[グァテマラ]]、[[タンザニア]]。"}, {"c": 13, "t": "フレンチローストのスリーキーワードは、Rich・[[Smoky]]・[[Spicy]]。"}, {"c": 13, "t": "フレンチローストはボディ[[4.5]]、アシディティ[[1]]。重厚なコク、どっしりした味わい。"}, {"c": 13, "t": "フレンチローストのパッケージは[[エッフェル塔]]。セールスワードは「深いコクと[[スモーキー]]感」。"}, {"c": 13, "t": "エチオピアモカ G1 ウラガ ナチュラルのスリーキーワードは、[[Raspberry]]・[[Floral]]・Bright。"}, {"c": 13, "t": "エチオピアモカ G1 ウラガ ナチュラルは、[[シダモ]]エリア・[[ウラガ]]地区の小規模生産者が作るコーヒー。"}, {"c": 13, "t": "エチオピアのパッケージは、エチオピア豆の象徴である[[ヤギ]]をアイコンにしている。"}, {"c": 13, "t": "エチオピアのセールスワードは「[[ベリー]]のようなフルーティな風味」、リラックスタイムにおすすめ。"}, {"c": 13, "t": "キリマンジャロ KIBO タリメ スイートウォッシュドのスリーキーワードは、[[Juicy]]・[[Round]]・[[Complex]]。"}, {"c": 13, "t": "コスタリカ ラ ミニータのスリーキーワードは、[[Clean]]・[[Smooth]]・Bright。"}, {"c": 13, "t": "コスタリカ ラ ミニータは「[[シトラス]]系の風味と優しい甘み」。"}, {"c": 13, "t": "コスタリカのパッケージには、幻の鳥といわれる[[ケツァール]]が描かれている。"}, {"c": 13, "t": "デカフェ ブラジルIP農園のスリーキーワードは、[[Caramel]]・[[Sweet]]・[[Soft]]。"}, {"c": 13, "t": "デカフェのセールスワードは「軽やかで優しい[[デカフェ]]」、[[夜、眠る前]]でも安心。"}, {"c": 13, "t": "1杯ずつマグで手軽に抽出できる個包装の商品は[[ZIPS]]（シングルサーブ）。"}, {"c": 14, "t": "ビーンズ販売＝お客様の[[コーヒー探し]]のお手伝い。"}, {"c": 14, "t": "ビーンズ販売の基本フローは、[[ファーストコンタクト]] → [[コミュニケーション]] → [[クロージング応対]]。"}, {"c": 14, "t": "どのステップでも「[[感じの良さ]]」をテーマにお客様に接する。"}, {"c": 14, "t": "ファーストコンタクトでは、「この人なら[[話しやすそう]]」と感じてもらえる第一印象づくりがポイント。"}, {"c": 14, "t": "あいさつは「こんにちは」＋「[[ご来店ありがとうございます]]」。"}, {"c": 14, "t": "「何かお探しですか？」よりも先にコーヒーの[[試飲]]を。"}, {"c": 14, "t": "販売時のコミュニケーションで目指したいのは、「購入後の[[満足]]と[[リピート]]」。"}, {"c": 14, "t": "コミュニケーションのポイントは、①お客様のことを[[知る]] ②お客様に合わせた[[提案]] ③コーヒーショップならではの[[情報]]提供 ④[[安心感]]や楽しい雰囲気づくり。"}, {"c": 14, "t": "まずは「[[どのような味わい]]がお好みですか？」から始める。"}, {"c": 14, "t": "一般的に、[[滞在時間]]が長いほど購買率がアップすると言われる。"}, {"c": 14, "t": "1種類だけの提案より、[[2]]つくらいから自分で選べる方が満足度はアップしやすい。"}, {"c": 14, "t": "プレゼントの場合、先に[[ご予算]]を伺ってみても良い。"}, {"c": 14, "t": "プレゼントには、手軽な[[ZIPS]]や、どなたにでも好まれやすい[[ハウスブレンド]]、華やかな[[シーズナルビーンズ]]がおすすめ。"}, {"c": 14, "t": "おすすめには「〇〇[[ので]]」と理由を添えると納得感がアップする。"}, {"c": 14, "t": "相手の言った単語やフレーズをそのまま返す聴き方を「[[オウム返し]]」という。"}, {"c": 14, "t": "クロージングでは、[[ビーンズカード]]の提案や、次回[[シーズナル]]商品のご案内をする。"}, {"c": 14, "t": "手提げ袋は[[ペーパーバッグ]]で、お見送りはなるべく[[入口]]まで丁寧に。"}, {"c": 14, "t": "最後は「ありがとうございます＋[[ひとこと]]」を心掛ける。"}, {"c": 14, "t": "試飲の目的は「[[体験]]」。販売につながらなくてもOK。"}, {"c": 14, "t": "試飲活動のシーンは、[[VMD]]（商品棚）、店内（客席）、[[セルフ]]（ポット）、[[店頭]]。"}, {"c": 14, "t": "ビーンズを見ているお客様には[[かならず]]試飲を提供する。"}, {"c": 14, "t": "VMDの試飲は、本日のコーヒーを試飲カップ[[半分]]程度。"}, {"c": 14, "t": "VMDでは、好みやニーズに合いそうな商品を[[1〜2]]個紹介する。"}, {"c": 14, "t": "セルフ試飲のカップは、HOTは[[3oz]]ホットカップ、ICEは3ozコールドカップ。"}, {"c": 14, "t": "使用期限が切れたCODは、[[ポット]]に入れても使用期限は同じなので使用しない。"}, {"c": 14, "t": "シーズナル発売前に納品される「[[サンプルビーンズ]]」も積極的に活用する。"}, {"c": 14, "t": "店頭では[[ハンドドリップ]]や[[コーヒープレス]]で実演すると、イベント感がアップする。"}]};</script>
<script>const D=window.__QA__;
const QA=D.qs.map((q,i)=>({...q,id:String(i),no:'Q'+(i+1)}));
const CZ=D.cz.map((z,i)=>({c:z.c,t:z.t,id:'z'+i,no:'穴'+(i+1),ans:[...z.t.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1])}));
const $=s=>document.getElementById(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let rec=store.get('ca_rec',{});let selCats=new Set(store.get('ca_cats',D.cats.map((_,i)=>i)));
let mode=store.get('ca_mode','cz');let lmode=mode;
let filter='all',order='rand',deck=[],pos=0,sessionNG=[],sessionOK=0,opened=0;
const items=m=>m==='cz'?CZ:QA;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const circ=n=>'①②③④⑤⑥⑦⑧⑨⑩'[n]||String(n+1);
$('total').textContent=QA.length;$('total-z').textContent=CZ.length;

function stats(){const L=items(mode);let ok=0,ng=0;L.forEach(q=>{if(rec[q.id]==='ok')ok++;else if(rec[q.id]==='ng')ng++});
 $('s-ok').textContent=ok;$('s-ng').textContent=ng;$('s-new').textContent=L.length-ok-ng;
 $('m-ok').style.width=(ok/L.length*100)+'%';$('m-ng').style.width=(ng/L.length*100)+'%';}
function renderCats(){const el=$('cats');el.innerHTML='';D.cats.forEach((c,i)=>{const n=items(mode).filter(q=>q.c===i).length;
 const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',selCats.has(i));
 b.innerHTML=`${esc(c)}<small>${n}</small>`;b.onclick=()=>{selCats.has(i)?selCats.delete(i):selCats.add(i);store.set('ca_cats',[...selCats]);renderCats();};el.appendChild(b)});count();}
function pool(){return items(mode).filter(q=>selCats.has(q.c)&&(filter==='all'||(filter==='ng'&&rec[q.id]==='ng')||(filter==='new'&&!rec[q.id])||(filter==='notok'&&rec[q.id]!=='ok')))}
function count(){const n=pool().length;$('count').textContent=n+'問が対象です';$('start').disabled=!n;}
function seg(id,cb){$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.v);count();})}
seg('filter',v=>filter=v);seg('order',v=>order=v);
function setMode(v){mode=v;store.set('ca_mode',v);$('modebar').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));stats();renderCats();}
$('modebar').querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.v));
seg('lmode',v=>{lmode=v;renderList()});
$('lmode').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===lmode));
$('all-on').onclick=()=>{selCats=new Set(D.cats.map((_,i)=>i));store.set('ca_cats',[...selCats]);renderCats()};
$('all-off').onclick=()=>{selCats=new Set();store.set('ca_cats',[]);renderCats()};
let resetArm=false;$('reset').onclick=()=>{const label=mode==='cz'?'穴埋め':'1問1答';
 if(!resetArm){resetArm=true;$('reset').textContent=`もう一度押すと${label}の記録をリセット`;$('reset-msg').textContent='';return}
 items(mode).forEach(q=>delete rec[q.id]);store.set('ca_rec',rec);resetArm=false;$('reset').textContent='記録をリセット';$('reset-msg').textContent=label+'の記録をリセットしました';stats();count();renderList();};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list){deck=order==='rand'?shuffle(list.slice()):list.slice();pos=0;sessionNG=[];sessionOK=0;
 $('setup').hidden=true;$('done').hidden=true;$('quiz').hidden=false;show();}
$('start').onclick=()=>start(pool());
function show(){const q=deck[pos];const isZ=q.id[0]==='z';
 $('p-text').textContent=`${pos+1} / ${deck.length}`;$('p-bar').style.width=(pos/deck.length*100)+'%';
 $('card').classList.toggle('cz',isZ);
 $('c-cat').textContent=D.cats[q.c];$('c-num').textContent=q.no;
 const m=rec[q.id];if(m){const s=document.createElement('span');s.className='mark '+m;s.textContent=m==='ok'?'前回○':'前回×';$('c-cat').appendChild(s)}
 $('ans').hidden=true;$('judge').hidden=true;$('reveal').hidden=false;opened=0;
 if(isZ){let k=0;$('c-q').innerHTML=esc(q.t).replace(/\[\[(.+?)\]\]/g,()=>{const n=k++;return `<button class="blank" data-i="${n}" aria-label="空欄${n+1}をめくる">（${circ(n)}）</button>`});
  $('c-q').querySelectorAll('.blank').forEach(b=>b.onclick=()=>openBlank(b));
  $('reveal').textContent=q.ans.length>1?'空欄をすべてめくる（スペース）':'答えを見る（スペース）';}
 else{$('c-q').textContent=q.q;$('c-a').textContent=q.a;$('c-n').textContent=q.n;$('c-n').hidden=!q.n;$('reveal').textContent='答えを見る（スペース）';}}
function openBlank(b){if(b.classList.contains('open'))return;const q=deck[pos];b.textContent=q.ans[+b.dataset.i];b.classList.add('open');b.removeAttribute('aria-label');opened++;
 if(opened>=q.ans.length){$('reveal').hidden=true;$('judge').hidden=false;}}
function reveal(){const q=deck[pos];if(q.id[0]==='z'){$('c-q').querySelectorAll('.blank').forEach(openBlank);}
 else{$('ans').hidden=false;$('judge').hidden=false;$('reveal').hidden=true;}}
$('reveal').onclick=reveal;
function judge(ok){const q=deck[pos];rec[q.id]=ok?'ok':'ng';store.set('ca_rec',rec);if(ok)sessionOK++;else sessionNG.push(q);pos++;
 if(pos>=deck.length)finish();else show();}
$('b-ok').onclick=()=>judge(true);$('b-ng').onclick=()=>judge(false);
function finish(){$('quiz').hidden=true;$('done').hidden=false;const t=sessionOK+sessionNG.length;
 $('d-score').textContent=`${sessionOK} / ${t}`;const r=t?sessionOK/t:0;
 $('d-msg').textContent=r===1?'全問正解です。別のカテゴリにも挑戦しましょう。':r>=.8?'あと少し。×の問題を復習すれば仕上がります。':'×の問題をもう一度解いて、定着させましょう。';
 $('retry-ng').hidden=!sessionNG.length;stats();count();renderList();}
$('retry-ng').onclick=()=>start(sessionNG);
$('back').onclick=$('quit').onclick=()=>{$('quiz').hidden=true;$('done').hidden=true;$('setup').hidden=false;stats();count();renderList();};
document.addEventListener('keydown',e=>{if($('quiz').hidden||e.target.tagName==='INPUT')return;
 if(e.key===' '||e.key==='Enter'){if(e.target.tagName==='BUTTON'&&e.target.id!=='reveal'&&!e.target.classList.contains('blank'))return;e.preventDefault();if(!$('reveal').hidden)reveal();}
 else if(!$('judge').hidden&&e.key==='ArrowRight')judge(true);else if(!$('judge').hidden&&e.key==='ArrowLeft')judge(false);});
function tab(t){$('tab-study').setAttribute('aria-selected',t==='study');$('tab-list').setAttribute('aria-selected',t==='list');$('view-study').hidden=t!=='study';$('view-list').hidden=t!=='list';}
$('tab-study').onclick=()=>tab('study');$('tab-list').onclick=()=>tab('list');

let openAll=false;
function renderList(){const k=$('search').value.trim();let html='',n=0;const L=items(lmode);
 D.cats.forEach((c,i)=>{const its=L.filter(q=>q.c===i&&(!k||(lmode==='cz'?q.t.replace(/\[\[|\]\]/g,''):q.q+q.a+q.n).includes(k)));if(!its.length)return;n+=its.length;
  html+=`<section><h3>${esc(c)}</h3>`+its.map(q=>{const m=rec[q.id];const mk=m?`<span class="mark ${m}">${m==='ok'?'○':'×'}</span>`:'';
   if(lmode==='cz')return `<div class="item"><span class="no">${q.no.replace('穴','')}</span><span class="ct">${esc(q.t).replace(/\[\[(.+?)\]\]/g,'<span class="b" title="タップで表示">$1</span>')}${mk}</span></div>`;
   return `<div class="item"><span class="no">${q.no}</span><span class="qq">${esc(q.q)}${mk}</span><details${openAll?' open':''}><summary>答え</summary><div class="aa">${esc(q.a)}</div>${q.n?`<div class="nn">${esc(q.n)}</div>`:''}</details></div>`}).join('')+'</section>'});
 const el=$('list');el.innerHTML=html||'<p class="hint">該当する問題はありません。</p>';el.classList.toggle('showall',openAll);$('l-count').textContent=n+'問';
 el.querySelectorAll('.b').forEach(b=>b.onclick=()=>b.classList.toggle('open'));}
$('search').oninput=renderList;
$('open-all').onclick=()=>{openAll=!openAll;$('open-all').textContent=openAll?'答えを隠す':'答えをすべて表示';renderList();};
setMode(mode);renderList();
</script>

</body></html>
