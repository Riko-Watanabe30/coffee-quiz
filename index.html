<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>コーヒーアドバイザー1問1答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: single column study desk — setup panel, then one flash card at a time, with a list view for review */
:root{
  --bg:#eef0ec; --surface:#fbfbf8; --ink:#2a2420; --muted:#6b645d; --line:#d8d6cf;
  --bean:#4a2c1d; --leaf:#1f6b5c; --leaf-soft:#dcebe5; --cherry:#b23a2e; --cherry-soft:#f4dfdb;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171513; --surface:#221f1c; --ink:#ece6df; --muted:#a59c92; --line:#3a3530;
  --bean:#d9b48f; --leaf:#5fbfa8; --leaf-soft:#1d3530; --cherry:#e2786b; --cherry-soft:#3d2421; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171513; --surface:#221f1c; --ink:#ece6df; --muted:#a59c92; --line:#3a3530;
  --bean:#d9b48f; --leaf:#5fbfa8; --leaf-soft:#1d3530; --cherry:#e2786b; --cherry-soft:#3d2421; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.3;margin:0;color:var(--bean);text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--bean);border-color:var(--bean)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.75rem;color:var(--muted);letter-spacing:.05em}
.stat.ok b{color:var(--leaf)} .stat.ng b{color:var(--cherry)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
h2{font-size:.8rem;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:.85rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chip small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--bean);border-color:var(--bean);color:var(--surface)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:.85rem;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.btn{all:unset;cursor:pointer;text-align:center;padding:12px 20px;border-radius:10px;font-weight:700;background:var(--bean);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 14px;font-weight:500;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:.8rem;color:var(--muted)}
/* card */
.progress{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bean);transition:width .2s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-height:260px}
.card .cat{font-size:.75rem;letter-spacing:.08em;color:var(--leaf);font-weight:700}
.card .q{font-size:1.15rem;font-weight:700;line-height:1.6;text-wrap:pretty}
.card .qnum{font-family:var(--display);color:var(--bean);margin-right:6px}
.answer{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.answer .a{font-size:1.1rem;font-weight:700;color:var(--bean)}
.answer .a::before{content:"A. ";font-family:var(--display);color:var(--muted)}
.answer .n{font-size:.88rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px}
.reveal{all:unset;cursor:pointer;margin-top:auto;text-align:center;padding:14px;border-radius:10px;border:1.5px dashed var(--bean);color:var(--bean);font-weight:700}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{all:unset;cursor:pointer;text-align:center;padding:14px;border-radius:10px;font-weight:700}
.judge .ng{background:var(--cherry-soft);color:var(--cherry)}
.judge .ok{background:var(--leaf-soft);color:var(--leaf)}
.mark{font-size:.75rem;padding:1px 8px;border-radius:999px;margin-left:6px;font-weight:700}
.mark.ok{background:var(--leaf-soft);color:var(--leaf)} .mark.ng{background:var(--cherry-soft);color:var(--cherry)}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .big{font-family:var(--display);font-size:2.6rem;color:var(--bean);font-variant-numeric:tabular-nums}
/* list */
.search{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.list{display:flex;flex-direction:column}
.list section h3{font-family:var(--display);color:var(--bean);font-size:1.05rem;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.item{padding:10px 2px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:2.6em 1fr;gap:4px 8px}
.item .no{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;padding-top:2px}
.item .qq{font-weight:500;min-width:0}
.item details{grid-column:2;min-width:0}
.item summary{cursor:pointer;color:var(--leaf);font-size:.85rem}
.item .aa{font-weight:700;color:var(--bean)}
.item .nn{font-size:.85rem;color:var(--muted)}
.showall .item details{display:block}
@media (max-width:480px){header h1{font-size:1.4rem}.card{padding:18px 16px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.blank{all:unset;cursor:pointer;display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--bean);background:var(--bg);border-radius:4px 4px 0 0;padding:0 6px;margin:0 2px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5}
.blank.open{background:var(--leaf-soft);color:var(--leaf);border-color:var(--leaf);cursor:default}
.cz .q{font-weight:500;line-height:2.1}
.item .ct{min-width:0;line-height:1.9}
.item .ct .b{border-bottom:2px solid var(--bean);padding:0 4px;color:transparent;background:var(--bg);border-radius:3px 3px 0 0;cursor:pointer}
.item .ct .b.open,.showall .item .ct .b{color:var(--leaf);background:var(--leaf-soft);border-color:var(--leaf)}
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modebar button{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.modebar button b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--ink)}
.modebar button span{font-size:.78rem;color:var(--muted)}
.modebar button[aria-pressed="true"]{border-color:var(--bean);background:var(--leaf-soft)}
.modebar button[aria-pressed="true"] b{color:var(--bean)}
</style>
<div class="wrap">
<header>
  <h1>コーヒーアドバイザー1問1答</h1>
  <p>研修資料29点から作成した穴埋め<span id="total-z"></span>問・1問1答<span id="total"></span>問。答えを思い浮かべてから空欄をめくりましょう。</p>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" id="tab-study" aria-selected="true">出題</button>
  <button role="tab" id="tab-list" aria-selected="false">一覧で確認</button>
</nav>

<main id="view-study">
  <div id="setup" style="display:flex;flex-direction:column;gap:18px">
    <div class="modebar" id="modebar">
      <button data-v="cz" aria-pressed="true"><b>穴埋め</b><span>文中の空欄をタップしてめくる</span></button>
      <button data-v="qa" aria-pressed="false"><b>1問1答</b><span>問いに答えてからめくる</span></button>
    </div>
    <div>
      <div class="stats">
        <div class="stat ok"><b id="s-ok">0</b><span>覚えた</span></div>
        <div class="stat ng"><b id="s-ng">0</b><span>要復習</span></div>
        <div class="stat"><b id="s-new">0</b><span>未回答</span></div>
      </div>
      <div class="meter" style="margin-top:8px"><i id="m-ok" style="background:var(--leaf)"></i><i id="m-ng" style="background:var(--cherry)"></i></div>
    </div>
    <div>
      <h2>カテゴリ</h2>
      <div class="cats" id="cats"></div>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" id="all-on">すべて選択</button>
        <button class="btn ghost" id="all-off">選択を解除</button>
      </div>
    </div>
    <div>
      <h2>出題する問題</h2>
      <div class="row">
        <div class="seg" id="filter">
          <button data-v="all" aria-pressed="true">すべて</button>
          <button data-v="ng" aria-pressed="false">要復習のみ</button>
          <button data-v="new" aria-pressed="false">未回答のみ</button>
          <button data-v="notok" aria-pressed="false">覚えた以外</button>
        </div>
        <div class="seg" id="order">
          <button data-v="rand" aria-pressed="true">ランダム</button>
          <button data-v="seq" aria-pressed="false">資料順</button>
        </div>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="start">はじめる</button>
      <span class="hint" id="count"></span>
    </div>
    <div class="row">
      <button class="btn ghost" id="reset">記録をリセット</button>
      <span class="hint" id="reset-msg"></span>
    </div>
  </div>

  <div id="quiz" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="progress"><span id="p-text"></span><button class="btn ghost" id="quit">終了</button></div>
    <div class="bar"><i id="p-bar"></i></div>
    <article class="card" id="card">
      <div class="cat" id="c-cat"></div>
      <div class="q"><span class="qnum" id="c-num"></span><span id="c-q"></span></div>
      <button class="reveal" id="reveal">答えを見る（スペース）</button>
      <div class="answer" id="ans" hidden>
        <div class="a" id="c-a"></div>
        <div class="n" id="c-n" hidden></div>
      </div>
    </article>
    <div class="judge" id="judge" hidden>
      <button class="ng" id="b-ng">× まだ（←）</button>
      <button class="ok" id="b-ok">○ わかった（→）</button>
    </div>
  </div>

  <div id="done" class="done" hidden>
    <div class="hint">今回の結果</div>
    <div class="big" id="d-score"></div>
    <div id="d-msg"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="retry-ng">間違えた問題をもう一度</button>
      <button class="btn ghost" id="back">設定に戻る</button>
    </div>
  </div>
</main>

<main id="view-list" hidden style="display:flex;flex-direction:column;gap:10px">
  <div class="seg" id="lmode"><button data-v="cz" aria-pressed="true">穴埋め</button><button data-v="qa" aria-pressed="false">1問1答</button></div>
  <input class="search" id="search" type="search" placeholder="キーワードで検索（例：3-7-10、ナチュラル、フレンチプレス）">
  <div class="row"><button class="btn ghost" id="open-all">答えをすべて表示</button><span class="hint" id="l-count"></span></div>
  <div class="list" id="list"></div>
</main>
